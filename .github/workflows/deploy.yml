name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.128.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fetch full history so .GitInfo / .Lastmod work

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        # 使用 config.toml 中的 baseurl = https://tanjunchen.github.io（根路径），
        # 不用 Pages 自动探测的子路径覆盖。
        run: |
          hugo --gc --minify

      - name: Generate Pagefind search index
        # 搜索使用 Pagefind（见 layouts/search/list.html 默认分支），
        # 需在 Hugo 构建后对 public 目录生成 /_pagefind/ 索引，否则搜索页 404 失效。
        # 主题引用的是 /_pagefind/ 路径（Pagefind 1.0+ 默认改为 /pagefind/），
        # 用 --output-subdir _pagefind 保持与主题一致。
        run: |
          npx -y pagefind@1.5.2 --site public --output-subdir _pagefind

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
