baseurl = "https://tanjunchen.github.io"
title = "漫步远方，心荡神往"
copyright = "tanjunchen"
theme = "hugo-cleanwhite"
languageCode = "en-us"
# Enable comments by entering your Disqus shortname
disqusShortname = ""
googleAnalytics = ""
preserveTaxonomyNames = true
paginate = 5 #frontpage pagination
hasCJKLanguage = true
summaryLength = 240

[outputs]
home = ["HTML", "RSS", "Algolia"]

[params]
  header_image = "img/home.webp"
  SEOTitle = "tanjunchen Blog | tanjunchen的博客"
  description = "tanjunchen，软件工程师, 开源爱好者, 互联网, 大模型, AI, 云原生, 容器, 微服务, Web, PaaS, Istio, Kubernetes, Microservice"
  keyword = "tanjunchen, 互联网, 大模型, AI, 云原生, 容器, 微服务, Web, PaaS, Istio, Kubernetes, Microservice"
  slogan = ""

  image_404 = "img/404.jpg"
  title_404 = "没有知识的荒原 :("
  omit_categories = true

  # Sidebar settings
  sidebar_about_description = "Software Developer"
  sidebar_avatar = "/img/tanjunchen.jpg"      # use absolute URL, seeing it's used in both `/` and `/about/`
  about_me = true

  # tag 
  featured_tags = false
  featured_condition_size = 5

  # Baidu Analytics
  ba_track_id = ""
  
  # We need a proxy to access Disqus api in China
  # Follow https://github.com/tanjunchen/disqus-php-api to set up your own disqus proxy
  disqus_proxy = ""
  disqus_site = ""

  # Twikoo comments
  twikoo_env_id = ""

  # Enable wechat pay & alipay to allow readers send reward money if they like the articles 
  reward = false 

  # 好友链接
  friends = false
  bookmarks = false

  # Giscus Comments & Reactions
  [params.giscus]
    data_repo = "tanjunchen/tanjunchen_blog"
    data_repo_id = "R_kgDOKARDsg"
    data_category = "Announcements"
    data_category_id = "DIC_kwDOKARDss4DC_vU"
    data_mapping = "pathname"
    data_reactions_enabled = "1"
    data_emit_metadata = "0"
    data_theme = "light"
    data_lang = "zh-CN"
    crossorigin = "anonymous"

  [params.social]
    rss            = false 
    email          = "tanjunchen20@gmail.com"
    github         = "https://github.com/tanjunchen"
    wechat         = 'img/wechat.jpg'
  
  [[params.friend_link]]
  title = "tanjunchen的博客"
  href =  "https://tanjunchen.github.io/"

  [[params.bookmark_link]]
  title =  "Martin Fowler"
  href =  "https://martinfowler.com"
  
  [[params.addtional_menus]]
  title =  "LEARNING"
  href =  "/learning"

  [[params.addtional_menus]]
  title =  "ARCHIVE"
  href =  "/archive"
  
  [[params.addtional_menus]]
  title =  "ABOUT"
  href =  "/about"

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[params.algolia]
vars = ["title", "summary", "date", "publishdate", "expirydate", "permalink"]
params = ["categories", "tags"] 

[markup]
  [markup.tableOfContents]
    endLevel = 2
    startLevel = 1
  [markup.highlight]
    style = "dracula"
  [markup.goldmark.renderer]
    unsafe = true

# 添加不蒜子计数
[params.busuanzi]
  busuanzi_site_offset = 1000
  enable = true
  site_uv = true
  site_uv_pre = '<i class="fa fa-user"></i>' 
  site_uv_post = ''
  site_pv = true
  site_pv_pre = '<i class="fa fa-eye"></i>'
  site_pv_post = ''
  page_pv = true
  page_pv_pre = '<i class="far fa-eye fa-fw"></i>'
  page_pv_post = ''
