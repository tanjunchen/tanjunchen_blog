<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="350" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">国产 GPU 三大长期挑战</text>

  <!-- Card 1: 制程 -->
  <rect x="30" y="66" width="270" height="240" rx="12" fill="#fff7e6" stroke="#e6a817" stroke-width="2"/>
  <circle cx="165" cy="120" r="34" fill="#e6a817"/>
  <text x="165" y="129" text-anchor="middle" font-size="26" fill="#fff" font-weight="700">1</text>
  <text x="165" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#8a6200">先进制程依赖</text>
  <text x="165" y="212" text-anchor="middle" font-size="12" fill="#555">高端 AI 芯片需 5nm/3nm</text>
  <text x="165" y="232" text-anchor="middle" font-size="12" fill="#555">EUV 光刻与产能受限</text>
  <text x="165" y="262" text-anchor="middle" font-size="12" fill="#8a6200">对策：架构创新 +</text>
  <text x="165" y="282" text-anchor="middle" font-size="12" fill="#8a6200">超节点堆规模</text>

  <!-- Card 2: HBM -->
  <rect x="315" y="66" width="270" height="240" rx="12" fill="#eaf6ff" stroke="#2e86de" stroke-width="2"/>
  <circle cx="450" cy="120" r="34" fill="#2e86de"/>
  <text x="450" y="129" text-anchor="middle" font-size="26" fill="#fff" font-weight="700">2</text>
  <text x="450" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#1a5a9c">HBM 供应瓶颈</text>
  <text x="450" y="212" text-anchor="middle" font-size="12" fill="#555">三星/海力士/美光垄断约 95%</text>
  <text x="450" y="232" text-anchor="middle" font-size="12" fill="#e8484f" font-weight="700">国产化率不足 2%</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#1a5a9c">对策：昇腾 950PR</text>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#1a5a9c">采用自研 HBM</text>

  <!-- Card 3: 生态 -->
  <rect x="600" y="66" width="270" height="240" rx="12" fill="#f2f9e8" stroke="#5a8c00" stroke-width="2"/>
  <circle cx="735" cy="120" r="34" fill="#5a8c00"/>
  <text x="735" y="129" text-anchor="middle" font-size="26" fill="#fff" font-weight="700">3</text>
  <text x="735" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#3a5c00">软件生态成熟度</text>
  <text x="735" y="212" text-anchor="middle" font-size="12" fill="#555">CUDA 600 万+ 开发者</text>
  <text x="735" y="232" text-anchor="middle" font-size="12" fill="#555">迁移成本与习惯壁垒</text>
  <text x="735" y="262" text-anchor="middle" font-size="12" fill="#3a5c00">对策：MUSA/NeuWare</text>
  <text x="735" y="282" text-anchor="middle" font-size="12" fill="#3a5c00">+ 国产模型 Day-0 适配</text>
</svg>
