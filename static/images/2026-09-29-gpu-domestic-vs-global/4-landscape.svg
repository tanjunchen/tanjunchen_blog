<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">国产 GPU 厂商图谱：三条技术路线</text>

  <!-- Route 1 -->
  <rect x="30" y="66" width="270" height="320" rx="12" fill="#eef4ff" stroke="#2e86de" stroke-width="2"/>
  <rect x="30" y="66" width="270" height="52" rx="12" fill="#2e86de"/>
  <text x="165" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">路线一 · 全功能 GPU</text>
  <text x="165" y="109" text-anchor="middle" font-size="12" fill="#eaf2ff">图形 + 计算兼顾，对标 NVIDIA「全能」</text>
  <g font-size="14" fill="#1a3a5c">
    <text x="60" y="152" font-weight="600">· 摩尔线程</text><text x="180" y="152" font-size="11" fill="#666">花港架构/KUAE</text>
    <text x="60" y="186" font-weight="600">· 景嘉微</text>
    <text x="60" y="220" font-weight="600">· 象帝先</text>
    <text x="60" y="254" font-weight="600">· 芯动科技</text>
  </g>
  <text x="165" y="360" text-anchor="middle" font-size="12" fill="#2e86de">既做 AI 计算，也做图形渲染</text>

  <!-- Route 2 -->
  <rect x="315" y="66" width="270" height="320" rx="12" fill="#f2f9e8" stroke="#5a8c00" stroke-width="2"/>
  <rect x="315" y="66" width="270" height="52" rx="12" fill="#5a8c00"/>
  <text x="450" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">路线二 · 通用 GPU / GPGPU</text>
  <text x="450" y="109" text-anchor="middle" font-size="12" fill="#eefadf">主攻 AI 训推，尽量兼容 CUDA</text>
  <g font-size="14" fill="#33500a">
    <text x="345" y="152" font-weight="600">· 寒武纪</text><text x="460" y="152" font-size="11" fill="#666">思元 690</text>
    <text x="345" y="186" font-weight="600">· 海光信息</text><text x="460" y="186" font-size="11" fill="#666">DCU 深算</text>
    <text x="345" y="220" font-weight="600">· 沐曦股份</text><text x="460" y="220" font-size="11" fill="#666">曦云 C600</text>
    <text x="345" y="254" font-weight="600">· 壁仞科技</text><text x="460" y="254" font-size="11" fill="#666">BR20X</text>
    <text x="345" y="288" font-weight="600">· 天数智芯</text><text x="460" y="288" font-size="11" fill="#666">天垓 300</text>
  </g>
  <text x="450" y="360" text-anchor="middle" font-size="12" fill="#5a8c00">「四小龙」：摩尔线程/沐曦/壁仞/天数</text>

  <!-- Route 3 -->
  <rect x="600" y="66" width="270" height="320" rx="12" fill="#fdeeee" stroke="#C7000B" stroke-width="2"/>
  <rect x="600" y="66" width="270" height="52" rx="12" fill="#C7000B"/>
  <text x="735" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">路线三 · 全栈自研 / 专用</text>
  <text x="735" y="109" text-anchor="middle" font-size="12" fill="#ffe6e6">DSA / 自研通用架构 / NPU，绑定自家云</text>
  <g font-size="14" fill="#7a0007">
    <text x="630" y="152" font-weight="600">· 华为昇腾</text><text x="750" y="152" font-size="11" fill="#666">NPU/达芬奇</text>
    <text x="630" y="186" font-weight="600">· 昆仑芯（百度）</text><text x="762" y="186" font-size="11" fill="#666">XPU</text>
    <text x="630" y="220" font-weight="600">· 平头哥（阿里）</text><text x="762" y="220" font-size="11" fill="#666">PPU</text>
    <text x="630" y="254" font-weight="600">· 燧原科技</text><text x="750" y="254" font-size="11" fill="#666">邃思 400/DSA</text>
  </g>
  <text x="735" y="360" text-anchor="middle" font-size="11" fill="#C7000B">XPU/PPU 介于 GPGPU 与专用 ASIC 之间</text>
</svg>
