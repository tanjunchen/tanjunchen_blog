<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#2b6cb0"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">点对点原语：两个 rank 之间收发（一切通信的积木）</text>

  <!-- Row 1: Send/Recv -->
  <text x="20" y="72" font-size="14" font-weight="700" fill="#2b6cb0">Send / Recv</text>
  <circle cx="210" cy="68" r="14" fill="#e8f0fe" stroke="#2b6cb0"/><text x="210" y="72" text-anchor="middle" font-size="11">r0</text>
  <circle cx="360" cy="68" r="14" fill="#e8f0fe" stroke="#2b6cb0"/><text x="360" y="72" text-anchor="middle" font-size="11">r1</text>
  <path d="M226 68 L344 68" stroke="#2b6cb0" stroke-width="2" marker-end="url(#s)"/>
  <text x="285" y="60" text-anchor="middle" font-size="11" fill="#2b6cb0">A</text>
  <text x="430" y="72" font-size="12.5" fill="#444">一块数据 A→B，<tspan font-weight="700">阻塞</tspan>到对端收完</text>

  <!-- Row 2: ISend/IRecv -->
  <text x="20" y="130" font-size="14" font-weight="700" fill="#2b6cb0">ISend / IRecv</text>
  <circle cx="210" cy="126" r="14" fill="#e8f0fe" stroke="#2b6cb0"/><text x="210" y="130" text-anchor="middle" font-size="11">r0</text>
  <circle cx="360" cy="126" r="14" fill="#e8f0fe" stroke="#2b6cb0"/><text x="360" y="130" text-anchor="middle" font-size="11">r1</text>
  <path d="M226 126 L344 126" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#s)"/>
  <text x="285" y="118" text-anchor="middle" font-size="11" fill="#2b6cb0">A（后台传）</text>
  <text x="430" y="130" font-size="12.5" fill="#444"><tspan font-weight="700">非阻塞</tspan>，立即返回，可与计算 overlap</text>

  <!-- Row 3: SendRecv (ring) -->
  <text x="20" y="200" font-size="14" font-weight="700" fill="#2b6cb0">SendRecv</text>
  <circle cx="200" cy="196" r="14" fill="#e8f0fe" stroke="#2b6cb0"/><text x="200" y="200" text-anchor="middle" font-size="11">r0</text>
  <circle cx="270" cy="196" r="14" fill="#e8f0fe" stroke="#2b6cb0"/><text x="270" y="200" text-anchor="middle" font-size="11">r1</text>
  <circle cx="340" cy="196" r="14" fill="#e8f0fe" stroke="#2b6cb0"/><text x="340" y="200" text-anchor="middle" font-size="11">r2</text>
  <circle cx="410" cy="196" r="14" fill="#e8f0fe" stroke="#2b6cb0"/><text x="410" y="200" text-anchor="middle" font-size="11">r3</text>
  <path d="M214 196 L256 196" stroke="#2b6cb0" stroke-width="2" marker-end="url(#s)"/>
  <path d="M284 196 L326 196" stroke="#2b6cb0" stroke-width="2" marker-end="url(#s)"/>
  <path d="M354 196 L396 196" stroke="#2b6cb0" stroke-width="2" marker-end="url(#s)"/>
  <path d="M410 210 C410 236, 200 236, 200 210" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#s)"/>
  <text x="430" y="200" font-size="12.5" fill="#444">同时「发右邻居 + 收左邻居」，环形移位<tspan font-weight="700">不死锁</tspan></text>

  <!-- Row 4: Barrier -->
  <text x="20" y="290" font-size="14" font-weight="700" fill="#2b6cb0">Barrier</text>
  <circle cx="195" cy="286" r="12" fill="#eef2f8" stroke="#2b6cb0"/><text x="195" y="290" text-anchor="middle" font-size="10">r0</text>
  <circle cx="240" cy="286" r="12" fill="#eef2f8" stroke="#2b6cb0"/><text x="240" y="290" text-anchor="middle" font-size="10">r1</text>
  <circle cx="285" cy="286" r="12" fill="#eef2f8" stroke="#2b6cb0"/><text x="285" y="290" text-anchor="middle" font-size="10">r2</text>
  <circle cx="330" cy="286" r="12" fill="#eef2f8" stroke="#2b6cb0"/><text x="330" y="290" text-anchor="middle" font-size="10">r3</text>
  <line x1="372" y1="268" x2="372" y2="304" stroke="#c05621" stroke-width="3"/>
  <line x1="378" y1="268" x2="378" y2="304" stroke="#c05621" stroke-width="3"/>
  <text x="375" y="262" text-anchor="middle" font-size="10" fill="#c05621">等齐</text>
  <path d="M345 286 L366 286" stroke="#888" stroke-width="1.6" marker-end="url(#g)"/>
  <path d="M384 286 L420 286" stroke="#5a8c00" stroke-width="2" marker-end="url(#s)"/>
  <text x="430" y="290" font-size="12.5" fill="#444">不传数据，所有 rank 到齐才一起放行（对齐时序）</text>
</svg>
