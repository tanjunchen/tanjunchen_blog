acity="1.0">省时延</text><rect x="56" y="764" width="1088" height="84" rx="14" fill="#FFFAF2" stroke="#DCE3EC" stroke-width="1"/><rect x="56" y="764" width="5" height="84" rx="2" fill="#D97706" stroke="#D97706" stroke-width="0"/><circle cx="96" cy="806" r="20" fill="#D97706" stroke="none" stroke-width="0"/><text x="96" y="812" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1.0">8</text><text x="132" y="801" font-size="21" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">调度</text><text x="132" y="829" font-size="16" font-weight="500" fill="#5B6472" text-anchor="start" opacity="1.0">Chunked Prefill · KV 预算 / QoS · 可观测与计费</text><rect x="936" y="789" width="180" height="34" rx="17.0" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><text x="1026.0" y="811.04" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">省成本</text><text x="56" y="876" font-size="12" font-weight="700" fill="#8A94A6" text-anchor="start" opacity="1.0">作用范围</text><circle cx="147" cy="871" r="7" fill="#3D5AFE" stroke="none" stroke-width="0"/><text x="160" y="876" font-size="12" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">模型内部</text><circle cx="297" cy="871" r="7" fill="#0E9F6E" stroke="none" stroke-width="0"/><text x="310" y="876" font-size="12" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">推理引擎</text><circle cx="447" cy="871" r="7" fill="#D97706" stroke="none" stroke-width="0"/><text x="460" y="876" font-size="12" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">集群与数据中心</text><rect x="56" y="890" width="1088" height="46" rx="10" fill="#F7F9FC" stroke="#E6EBF3" stroke-width="1"/><text x="76" y="918" font-size="14" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">八层不是八选一：结构层省下来的，精度层还能再省一遍；但每叠一层，精度和工程复杂度也会叠一层。</text></svg>