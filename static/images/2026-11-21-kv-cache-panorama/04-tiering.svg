<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="780" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">KV 的分层存储：把冷数据请出显存</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">从 HBM 到分布式存储，容量越来越大，速度越来越慢；分层的关键是预判和限流</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><rect x="170" y="150" width="380" height="104" rx="16" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.5"/><text x="192" y="184" font-size="13" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0" letter-spacing="1.5">L1</text><text x="192" y="216" font-size="21" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">GPU HBM</text><text x="192" y="240" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">正在跑的请求，热会话</text><text x="530" y="184" font-size="12" font-weight="700" fill="#3D5AFE" text-anchor="end" opacity="1.0">TB/s · 亚微秒</text><rect x="130" y="268" width="460" height="104" rx="16" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.5"/><text x="152" y="302" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="start" opacity="1.0" letter-spacing="1.5">L2</text><text x="152" y="334" font-size="21" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">CPU DRAM</text><text x="152" y="358" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">温会话，随时能回迁</text><text x="570" y="302" font-size="12" font-weight="700" fill="#0E9F6E" text-anchor="end" opacity="1.0">百 GB/s · 百纳秒</text><rect x="90" y="386" width="540" height="104" rx="16" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/><text x="112" y="420" font-size="13" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0" letter-spacing="1.5">L3</text><text x="112" y="452" font-size="21" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">本地 NVMe</text><text x="112" y="476" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">冷上下文，量大管饱</text><text x="610" y="420" font-size="12" font-weight="700" fill="#D97706" text-anchor="end" opacity="1.0">GB/s · 百微秒</text><rect x="50" y="504" width="620" height="104" rx="16" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.5"/><text x="72" y="538" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="start" opacity="1.0" letter-spacing="1.5">L4</text><text x="72" y="570" font-size="21" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">分布式存储</text><text x="72" y="594" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">海量历史，跨节点共享</text><text x="650" y="538" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="end" opacity="1.0">网络 · 毫秒级</text><text x="720" y="178" font-size="18" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">为什么不干脆全放显存？</text><circle cx="728" cy="209" r="5" fill="#D97706" stroke="none" stroke-width="0"/><text x="742" y="214" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">贵</text><text x="742" y="238" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">同样 1GB，HBM 和 SSD 的成本差一个数量级。</text><circle cx="728" cy="277" r="5" fill="#D97706" stroke="none" stroke-width="0"/><text x="742" y="282" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">冷热不均</text><text x="742" y="306" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">Agent 的长前缀可能几小时才用一次，占着 HBM 不划算。</text><circle cx="728" cy="345" r="5" fill="#D97706" stroke="none" stroke-width="0"/><text x="742" y="350" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">回迁有代价</text><text x="742" y="374" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">回迁会抢 PCIe / 网络带宽，得靠预取和限流兜住。</text><rect x="720" y="430" width="424" height="190" rx="14" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.5"/><text x="742" y="462" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">先算一笔回迁账</text><text x="742" y="492" font-size="15" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">回迁次数 ≈ 未命中次数</text><text x="742" y="520" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">命中率每高一点，PCIe 和网络就少堵一点。</text><text x="742" y="548" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">所以分层不是「层数越多越好」，</text><text x="742" y="570" font-size="13" font-weight="600" fill="#14171F" text-anchor="start" opacity="1.0">而是「预取准、回迁稳、限流狠」。</text><text x="742" y="598" font-size="12" font-weight="600" fill="#DC2626" text-anchor="start" opacity="1.0">一个反直觉的点：回迁本身也会制造毛刺。</text><text x="56" y="628" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">越往下：容量更大、成本更低、速度更慢。分层不是免费的，每一跳都有代价。</text><rect x="56" y="650" width="1088" height="78" rx="14" fill="#F7F9FC" stroke="#E6EBF3" stroke-width="1"/><text x="78" y="680" font-size="13" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">工程上把这套东西做成共享 KV 池的代表</text><rect x="78" y="692" width="92" height="26" rx="13.0" fill="#FFFFFF" stroke="#3D5AFE" stroke-width="1.2"/><text x="124.0" y="709.32" font-size="12" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">Mooncake</text><rect x="180" y="692" width="92" height="26" rx="13.0" fill="#FFFFFF" stroke="#0E9F6E" stroke-width="1.2"/><text x="226.0" y="709.32" font-size="12" font-weight="700" fill="#0E9F6E" text-anchor="middle" opacity="1.0">LMCache</text><rect x="282" y="692" width="92" height="26" rx="13.0" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><text x="328.0" y="709.32" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">NVMe-oF</text><rect x="384" y="692" width="96.64" height="26" rx="13.0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/><text x="432.32" y="709.32" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle" opacity="1.0">CXL 内存池</text><rect x="490.64" y="692" width="92" height="26" rx="13.0" fill="#FFFFFF" stroke="#14171F" stroke-width="1.2"/><text x="536.64" y="709.32" font-size="12" font-weight="700" fill="#14171F" text-anchor="middle" opacity="1.0">DPU 卸载</text><text x="56" y="758" font-size="12" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">示意：各层容量、带宽、时延随硬件和部署方式变化；图中只表达数量级关系。</text></svg>