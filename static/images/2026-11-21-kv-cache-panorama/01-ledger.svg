<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="800" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">先算一笔账：KV 到底有多重</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">以一个 70B GQA 模型为例，80 层、8 个 KV 头、128 维，FP16 存储</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><rect x="56" y="140" width="520" height="280" rx="16" fill="#F7F9FC" stroke="#DCE3EC" stroke-width="1.5"/><text x="80" y="178" font-size="16" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0" letter-spacing="1">一个 token 的 KV</text><text x="80" y="224" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">2 × 80 × 8 × 128 × 2 B</text><text x="80" y="264" font-size="21" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">= 327,680 B</text><text x="232" y="264" font-size="21" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">≈ 320 KB / token</text><line x1="80" y1="286" x2="552" y2="286" stroke="#DCE3EC" stroke-width="1"/><text x="80" y="316" font-size="17" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">2</text><text x="99.69" y="316" font-size="16" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">K 和 V 各一份</text><text x="330" y="316" font-size="17" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">80</text><text x="359.38" y="316" font-size="16" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">Transformer 层数</text><text x="80" y="356" font-size="17" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">8</text><text x="99.69" y="356" font-size="16" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">KV 头数（GQA）</text><text x="330" y="356" font-size="17" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">128</text><text x="369.07" y="356" font-size="16" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">每个头的维度</text><text x="80" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">2 B</text><text x="119.07" y="396" font-size="16" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">FP16 一个数</text><rect x="600" y="140" width="544" height="280" rx="16" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.5"/><text x="624" y="178" font-size="16" font-weight="800" fill="#0E9F6E" text-anchor="start" opacity="1.0" letter-spacing="1">上下文一长，账就吓人</text><text x="624" y="204" font-size="14" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">以下都是「一个请求」的量</text><rect x="624" y="224" width="210" height="38" rx="10" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1"/><text x="640" y="249" font-size="16" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">8K</text><text x="822" y="249" font-size="16" font-weight="800" fill="#3D5AFE" text-anchor="end" opacity="1.0">2.5 GB</text><rect x="624" y="270" width="285" height="38" rx="10" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1"/><text x="640" y="295" font-size="16" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">32K</text><text x="897" y="295" font-size="16" font-weight="800" fill="#3D5AFE" text-anchor="end" opacity="1.0">10 GB</text><rect x="624" y="316" width="375" height="38" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1"/><text x="640" y="341" font-size="16" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">128K</text><text x="987" y="341" font-size="16" font-weight="800" fill="#D97706" text-anchor="end" opacity="1.0">40 GB</text><rect x="624" y="362" width="485" height="38" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/><text x="640" y="387" font-size="16" font-weight="800" fill="#DC2626" text-anchor="start" opacity="1.0">1M</text><text x="1097" y="387" font-size="16" font-weight="800" fill="#DC2626" text-anchor="end" opacity="1.0">320 GB</text><rect x="56" y="446" width="530" height="122" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/><text x="78" y="478" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="start" opacity="1.0">一张 80GB 卡，装完 70B FP8 权重</text><text x="78" y="512" font-size="28" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">剩约 10GB</text><text x="262" y="512" font-size="16" font-weight="600" fill="#14171F" text-anchor="start" opacity="1.0">÷ 320KB ≈ 3.1 万 token</text><text x="78" y="544" font-size="14" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">一个 32K 上下文的请求，就能把剩下的显存吃干净。</text><rect x="602" y="446" width="542" height="122" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/><text x="624" y="478" font-size="16" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1.0">八个 128K 请求同时在线</text><text x="624" y="512" font-size="28" font-weight="800" fill="#DC2626" text-anchor="start" opacity="1.0">8 × 40GB = 320GB</text><text x="624" y="544" font-size="14" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">等于四张 80GB 卡，只放历史，不放权重。</text><rect x="56" y="594" width="1088" height="124" rx="16" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.5"/><rect x="56" y="594" width="5" height="124" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/><text x="80" y="626" font-size="17" font-weight="700" fill="#14171F" text-anchor="start" opacity="1.0">Decode 更麻烦：每生成一个 token，都要把这个请求的历史 KV 从 HBM 读一遍。</text><text x="80" y="662" font-size="17" font-weight="700" fill="#14171F" text-anchor="start" opacity="1.0">128K 上下文，一个 token 要读 40GB 的 KV；3TB/s 的 HBM，理论上限也就每秒几十个 token。</text><text x="80" y="696" font-size="16" font-weight="800" fill="#DC2626" text-anchor="start" opacity="1.0">算力不是不够，是喂不饱。</text><text x="56" y="756" font-size="13" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">口径：Llama-3-70B 级别配置；FP16 KV。换模型时按公式替换层数、KV 头数和维度即可。</text><text x="56" y="780" font-size="13" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">别把 890 字节/token 这类数字直接套过来：那是特定模型的「全局 KV」口径，不含每层滑动窗口。</text></svg>