<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">超节点如何改变并行策略：把最贵的通信塞进域内</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#888">TP/EP 通信最密集 → 放进 Scale-up 域；PP/DP 通信稀疏 → 可跨超节点走网络</text>

  <rect x="30" y="72" width="840" height="110" rx="10" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="48" y="98" font-size="13" font-weight="700" fill="#1a5a9c">TP 张量并行</text>
  <text x="48" y="118" font-size="11" fill="#555">切「单层内部」的大矩阵，每步 all-reduce 同步</text>
  <text x="48" y="136" font-size="11" fill="#c0392b" font-weight="700">通信最频繁，吃带宽+延迟 → 必须域内</text>

  <text x="320" y="98" font-size="13" font-weight="700" fill="#1a5a9c">EP 专家并行</text>
  <text x="320" y="118" font-size="11" fill="#555">MoE，不同专家放不同卡，每层 all-to-all 路由</text>
  <text x="320" y="136" font-size="11" fill="#c0392b" font-weight="700">吃全互联带宽 → 优先域内</text>

  <text x="600" y="98" font-size="13" font-weight="700" fill="#1a5a9c">PP 流水线并行 / DP 数据并行</text>
  <text x="600" y="118" font-size="11" fill="#555">PP 按层切成几段；DP 复制多份各算一批数据</text>
  <text x="600" y="136" font-size="11" fill="#5a8c00" font-weight="700">通信稀疏/可容忍延迟 → 可跨超节点</text>
  <text x="48" y="166" font-size="11" fill="#888">口诀：谁同步得最勤，谁就得待在最快的互联域里；超节点把「域」做大，让更多 TP/EP 留在域内。</text>

  <text x="30" y="212" font-size="13" font-weight="700" fill="#333">典型映射：万亿 MoE 训练</text>

  <rect x="30" y="224" width="390" height="190" rx="12" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="225" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#3a5c00">超节点 A（Scale-up 域，TB/s·亚微秒）</text>
  <g font-size="10" fill="#fff" font-weight="700">
    <rect x="55" y="262" width="78" height="34" rx="5" fill="#76b900"/><text x="94" y="284" text-anchor="middle">卡·专家1</text>
    <rect x="143" y="262" width="78" height="34" rx="5" fill="#76b900"/><text x="182" y="284" text-anchor="middle">卡·专家2</text>
    <rect x="231" y="262" width="78" height="34" rx="5" fill="#76b900"/><text x="270" y="284" text-anchor="middle">卡·专家3</text>
    <rect x="319" y="262" width="78" height="34" rx="5" fill="#76b900"/><text x="358" y="284" text-anchor="middle">卡·专家4</text>
  </g>
  <text x="225" y="322" text-anchor="middle" font-size="10.5" fill="#3a5c00" font-weight="700">域内：TP 切矩阵 + EP all-to-all 路由 token</text>
  <path d="M94 300 C 160 350, 290 350, 358 300" stroke="#5a8c00" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="225" y="372" text-anchor="middle" font-size="10.5" fill="#666">高频通信全部留在域内，GPU 不「等数据」</text>
  <text x="225" y="394" text-anchor="middle" font-size="10.5" fill="#888">显存池化：巨大权重 / KV Cache 摊进域内大池</text>

  <rect x="440" y="300" width="60" height="40" rx="6" fill="#1a5a9c"/>
  <text x="470" y="318" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">网络</text>
  <text x="470" y="332" text-anchor="middle" font-size="9" fill="#cfe0ff">IB/以太</text>
  <path d="M420 320 L438 320" stroke="#1a5a9c" stroke-width="2" marker-end="url(#ar2)"/>
  <path d="M502 320 L518 320" stroke="#1a5a9c" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="470" y="360" text-anchor="middle" font-size="9.5" fill="#1a5a9c" font-weight="700">PP/DP</text>
  <text x="470" y="374" text-anchor="middle" font-size="9" fill="#888">跨域</text>

  <rect x="520" y="224" width="350" height="190" rx="12" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="695" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#3a5c00">超节点 B（下一个流水段 / 另一数据副本）</text>
  <g font-size="10" fill="#fff" font-weight="700">
    <rect x="545" y="262" width="72" height="34" rx="5" fill="#76b900"/><text x="581" y="284" text-anchor="middle">卡·专家5</text>
    <rect x="627" y="262" width="72" height="34" rx="5" fill="#76b900"/><text x="663" y="284" text-anchor="middle">卡·专家6</text>
    <rect x="709" y="262" width="72" height="34" rx="5" fill="#76b900"/><text x="745" y="284" text-anchor="middle">卡·专家7</text>
    <rect x="791" y="262" width="60" height="34" rx="5" fill="#76b900"/><text x="821" y="284" text-anchor="middle">…</text>
  </g>
  <text x="695" y="322" text-anchor="middle" font-size="10.5" fill="#3a5c00" font-weight="700">同样域内跑 TP/EP</text>
  <text x="695" y="352" text-anchor="middle" font-size="10.5" fill="#666">超节点之间只走 PP（层间）/ DP（梯度同步）</text>
  <text x="695" y="374" text-anchor="middle" font-size="10.5" fill="#888">这些通信稀疏、能容忍较高延迟，适合跨机</text>
  <text x="695" y="396" text-anchor="middle" font-size="10.5" fill="#888">→ 整体 MFU（算力利用率）显著提升</text>

  <rect x="30" y="430" width="840" height="56" rx="10" fill="#fff7e6" stroke="#e0a800"/>
  <text x="50" y="454" font-size="12.5" font-weight="700" fill="#7a5c00">结论：</text>
  <text x="50" y="474" font-size="11.5" fill="#7a5c00">超节点改变的不只是规模，而是「什么并行策略在工程上划算」——域越大，越多 TP/EP 能免于跨机通信的拖累。</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5a8c00"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1a5a9c"/></marker>
  </defs>
</svg>
