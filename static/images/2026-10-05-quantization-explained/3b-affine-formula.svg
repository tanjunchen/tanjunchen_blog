<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="250" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="700" fill="#1a1a1a">仿射映射：量化与反量化公式</text>

  <!-- quantize -->
  <rect x="20" y="46" width="920" height="72" rx="10" fill="#eef4ff" stroke="#2e86de"/>
  <text x="40" y="70" font-size="13" font-weight="700" fill="#2e86de">量化 Quantization</text>
  <g font-size="20" fill="#1a1a1a">
    <text x="300" y="94" font-style="italic">q</text>
    <text x="322" y="94">=</text>
    <text x="346" y="94">clip(</text>
    <text x="400" y="94">round(</text>
    <!-- fraction x / s -->
    <text x="486" y="86" font-style="italic" font-size="16" text-anchor="middle">x</text>
    <line x1="470" y1="90" x2="502" y2="90" stroke="#1a1a1a" stroke-width="1.3"/>
    <text x="486" y="106" font-style="italic" font-size="16" text-anchor="middle">s</text>
    <text x="506" y="94">)</text>
    <text x="524" y="94">+</text>
    <text x="548" y="94" font-style="italic">z</text>
    <text x="564" y="94">,</text>
    <text x="582" y="94" font-style="italic">q<tspan font-size="12" dy="5">min</tspan></text>
    <text x="632" y="94">,</text>
    <text x="650" y="94" font-style="italic">q<tspan font-size="12" dy="5">max</tspan></text>
    <text x="698" y="94">)</text>
  </g>

  <!-- dequantize -->
  <rect x="20" y="128" width="920" height="72" rx="10" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="40" y="152" font-size="13" font-weight="700" fill="#5a8c00">反量化 Dequantization</text>
  <g font-size="20" fill="#1a1a1a">
    <text x="360" y="178" font-style="italic">x</text>
    <path d="M358,160 L365,153 L372,160" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
    <text x="386" y="178">=</text>
    <text x="410" y="178">(</text>
    <text x="424" y="178" font-style="italic">q</text>
    <text x="444" y="178">&#8722;</text>
    <text x="470" y="178" font-style="italic">z</text>
    <text x="486" y="178">)</text>
    <text x="506" y="178">&#215;</text>
    <text x="532" y="178" font-style="italic">s</text>
  </g>

  <!-- legend -->
  <text x="24" y="226" font-size="12.5" fill="#555"><tspan font-style="italic" font-weight="700">s</tspan> = scale 缩放因子　<tspan font-style="italic" font-weight="700">z</tspan> = zero_point 零点（整数域中浮点 0 对应的位置）　<tspan font-style="italic" font-weight="700">q</tspan><tspan font-size="10" dy="4">min</tspan><tspan dy="-4">/</tspan><tspan font-style="italic" font-weight="700">q</tspan><tspan font-size="10" dy="4">max</tspan><tspan dy="-4"> = 整数边界（INT8：[-128,127] 或 [0,255]）</tspan></text>
</svg>
