<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a1a1a">对称量化 vs 非对称量化：区别只在 zero_point 是否为 0</text>

  <!-- symmetric -->
  <rect x="20" y="48" width="455" height="200" rx="10" fill="#eef4ff" stroke="#2e86de"/>
  <text x="40" y="76" font-size="15" font-weight="700" fill="#2e86de">对称量化（zero_point = 0）</text>
  <text x="40" y="100" font-size="12.5" fill="#555">适合零对称分布，典型：神经网络<tspan font-weight="700" fill="#333">权重</tspan></text>
  <!-- number line -->
  <line x1="60" y1="140" x2="435" y2="140" stroke="#999" stroke-width="1.5"/>
  <line x1="60" y1="134" x2="60" y2="146" stroke="#999" stroke-width="1.5"/>
  <line x1="247" y1="130" x2="247" y2="150" stroke="#C7000B" stroke-width="2"/>
  <line x1="435" y1="134" x2="435" y2="146" stroke="#999" stroke-width="1.5"/>
  <text x="60" y="166" font-size="11.5" fill="#555" text-anchor="middle">-a</text>
  <text x="247" y="166" font-size="11.5" fill="#C7000B" font-weight="700" text-anchor="middle">0</text>
  <text x="435" y="166" font-size="11.5" fill="#555" text-anchor="middle">+a</text>
  <text x="60" y="184" font-size="11.5" fill="#2e86de" text-anchor="middle">-127</text>
  <text x="247" y="184" font-size="11.5" fill="#2e86de" font-weight="700" text-anchor="middle">0</text>
  <text x="435" y="184" font-size="11.5" fill="#2e86de" text-anchor="middle">127</text>
  <text x="247" y="210" font-size="11.5" fill="#888" text-anchor="middle">浮点 0 恰好对齐整数 0</text>
  <rect x="40" y="222" width="415" height="20" rx="4" fill="#dbeafe"/>
  <text x="247" y="236" font-size="11.5" fill="#1a3a5c" text-anchor="middle" font-weight="700">scale = max(|x|) / 127,  zero_point = 0</text>

  <!-- asymmetric -->
  <rect x="485" y="48" width="455" height="200" rx="10" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="505" y="76" font-size="15" font-weight="700" fill="#5a8c00">非对称量化（zero_point ≠ 0）</text>
  <text x="505" y="100" font-size="12.5" fill="#555">适合单边分布，典型：ReLU 之后的<tspan font-weight="700" fill="#333">激活</tspan></text>
  <line x1="525" y1="140" x2="900" y2="140" stroke="#999" stroke-width="1.5"/>
  <line x1="525" y1="130" x2="525" y2="150" stroke="#C7000B" stroke-width="2"/>
  <line x1="900" y1="134" x2="900" y2="146" stroke="#999" stroke-width="1.5"/>
  <text x="525" y="166" font-size="11.5" fill="#C7000B" font-weight="700" text-anchor="middle">0</text>
  <text x="900" y="166" font-size="11.5" fill="#555" text-anchor="middle">b</text>
  <text x="525" y="184" font-size="11.5" fill="#5a8c00" font-weight="700" text-anchor="middle">0</text>
  <text x="900" y="184" font-size="11.5" fill="#5a8c00" text-anchor="middle">255</text>
  <text x="712" y="210" font-size="11.5" fill="#888" text-anchor="middle">整个区间可平移，充分利用 [0,255]</text>
  <rect x="505" y="222" width="415" height="20" rx="4" fill="#dcfce7"/>
  <text x="712" y="236" font-size="11" fill="#2f4a00" text-anchor="middle" font-weight="700">scale = (x_max - x_min)/255,  zp = -round(x_min/scale)</text>

  <!-- tradeoff -->
  <rect x="20" y="262" width="920" height="100" rx="10" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="36" y="288" font-size="14" font-weight="700" fill="#333">取舍</text>
  <text x="36" y="312" font-size="12.5" fill="#555"><tspan fill="#2e86de" font-weight="700">对称</tspan>：少一个 zp，矩阵乘不用处理交叉项 → 硬件更友好、更快；缺点是对单边分布浪费一半范围（ReLU 激活负半轴全空）</text>
  <text x="36" y="336" font-size="12.5" fill="#555"><tspan fill="#5a8c00" font-weight="700">非对称</tspan>：表示范围利用更充分、精度略高；缺点是矩阵乘要额外展开 zp 交叉项，计算更繁</text>
  <text x="36" y="356" font-size="11.5" fill="#888">工程惯例：权重用「对称 per-channel」，激活用「非对称 per-tensor」（TensorRT / PyTorch 默认大多如此）</text>

  <text x="24" y="398" font-size="12.5" fill="#C7000B" font-weight="700">一句话：对称给权重，非对称给激活 —— 看数据分布是否以 0 为中心</text>
</svg>
