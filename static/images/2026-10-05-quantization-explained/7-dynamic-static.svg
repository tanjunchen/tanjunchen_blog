<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="340" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a1a1a">动态量化 vs 静态量化：激活的 scale 什么时候算</text>
  <text x="24" y="52" font-size="12.5" fill="#888">二者都属 PTQ，权重都是离线量化好的；区别在激活</text>

  <!-- dynamic -->
  <rect x="20" y="70" width="455" height="230" rx="10" fill="#eef4ff" stroke="#2e86de"/>
  <text x="40" y="98" font-size="15" font-weight="700" fill="#2e86de">动态量化（dynamic）</text>
  <rect x="40" y="112" width="415" height="34" rx="6" fill="#dbeafe"/><text x="247" y="134" font-size="12" fill="#1a3a5c" text-anchor="middle">权重 → 离线量化好</text>
  <rect x="40" y="152" width="415" height="34" rx="6" fill="#f0f6ff" stroke="#9cc3f0"/><text x="247" y="174" font-size="12" fill="#1a3a5c" text-anchor="middle" font-weight="700">激活 → 推理时实时统计 min/max 现算 scale</text>
  <text x="40" y="212" font-size="12.5" fill="#5a8c00" font-weight="700">✓ 无需校准集，开箱即用</text>
  <text x="40" y="234" font-size="12.5" fill="#5a8c00" font-weight="700">✓ 对激活分布多变的模型稳（NLP/RNN/Transformer）</text>
  <text x="40" y="258" font-size="12.5" fill="#C7000B">✗ 每次前向都要在线统计，有额外开销</text>
  <text x="40" y="286" font-size="11.5" fill="#888">PyTorch 对 nn.Linear 一行就能开</text>

  <!-- static -->
  <rect x="485" y="70" width="455" height="230" rx="10" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="505" y="98" font-size="15" font-weight="700" fill="#5a8c00">静态量化（static）</text>
  <rect x="505" y="112" width="415" height="34" rx="6" fill="#dcfce7"/><text x="712" y="134" font-size="12" fill="#2f4a00" text-anchor="middle">权重 → 离线量化好</text>
  <rect x="505" y="152" width="415" height="34" rx="6" fill="#eefbe3" stroke="#a7cf7f"/><text x="712" y="174" font-size="12" fill="#2f4a00" text-anchor="middle" font-weight="700">激活 → 校准集提前统计好 scale，推理时固定</text>
  <text x="505" y="212" font-size="12.5" fill="#5a8c00" font-weight="700">✓ 推理时无统计开销，吞吐最高</text>
  <text x="505" y="234" font-size="12.5" fill="#5a8c00" font-weight="700">✓ 能完整走 INT8 Tensor Core</text>
  <text x="505" y="258" font-size="12.5" fill="#C7000B">✗ 需有代表性校准集；分布漂移时精度掉</text>
  <text x="505" y="286" font-size="11.5" fill="#888">CNN 高吞吐部署的标配</text>

  <text x="24" y="326" font-size="12.5" fill="#333" font-weight="700">选型：CNN+能拿校准集+极致吞吐 → 静态；NLP/LLM+激活范围剧变+不想备校准集 → 动态</text>
</svg>
