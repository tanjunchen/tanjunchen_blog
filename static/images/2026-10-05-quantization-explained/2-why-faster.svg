<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a1a1a">量化为何能加速：三个层面，缺一不可</text>

  <!-- card 1 -->
  <rect x="20" y="50" width="300" height="150" rx="10" fill="#eef4ff" stroke="#2e86de"/>
  <text x="40" y="78" font-size="15" font-weight="700" fill="#2e86de">① 显存 / 带宽减半</text>
  <text x="40" y="104" font-size="12.5" fill="#555">存储：FP16→INT8 减半，INT4 减到 1/4</text>
  <text x="40" y="128" font-size="12.5" fill="#333" font-weight="700">7B 模型权重：</text>
  <text x="52" y="150" font-size="12" fill="#555">FP16 ≈ 14 GB</text>
  <text x="52" y="170" font-size="12" fill="#555">INT8 ≈ 7 GB</text>
  <text x="52" y="190" font-size="12" fill="#C7000B" font-weight="700">INT4 ≈ 3.5 GB</text>

  <!-- card 2 -->
  <rect x="330" y="50" width="300" height="150" rx="10" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="350" y="78" font-size="15" font-weight="700" fill="#5a8c00">② 整数运算吞吐翻倍</text>
  <text x="350" y="104" font-size="12.5" fill="#555">Tensor Core 对低精度有专门通路</text>
  <text x="350" y="130" font-size="12.5" fill="#333" font-weight="700">NVIDIA A100：</text>
  <text x="362" y="152" font-size="12" fill="#555">FP16 ≈ 312 TFLOPS</text>
  <text x="362" y="172" font-size="12" fill="#C7000B" font-weight="700">INT8 ≈ 624 TOPS（约 2×）</text>
  <text x="350" y="192" font-size="11.5" fill="#888">H100 支持 FP8，吞吐再翻倍</text>

  <!-- card 3 -->
  <rect x="640" y="50" width="300" height="150" rx="10" fill="#f6eefb" stroke="#8e44ad"/>
  <text x="660" y="78" font-size="15" font-weight="700" fill="#8e44ad">③ 缓存命中提升</text>
  <text x="660" y="104" font-size="12.5" fill="#555">数据变小，更多参数能塞进</text>
  <text x="660" y="126" font-size="12.5" fill="#555">L2 / 寄存器</text>
  <text x="660" y="152" font-size="12.5" fill="#333" font-weight="700">→ 减少 DRAM 往返</text>
  <text x="660" y="180" font-size="11.5" fill="#888">访存次数降低，端到端延迟下降</text>

  <!-- key fact -->
  <rect x="20" y="222" width="920" height="78" rx="10" fill="#fff7ed" stroke="#d35400"/>
  <text x="40" y="250" font-size="14" font-weight="700" fill="#d35400">⚠ 一个常被忽略的事实</text>
  <text x="40" y="276" font-size="13" fill="#333">大模型推理（尤其 decode 阶段）<tspan font-weight="700" fill="#C7000B">绝大多数时候瓶颈在显存带宽，不在算力</tspan>。</text>
  <text x="40" y="296" font-size="13" fill="#333">所以 weight-only 量化（只压权重）即使不省算力，光靠「权重搬得快」就能显著提速 —— 这正是下篇 GPTQ/AWQ 的立足点。</text>

  <!-- dequant vs fake quant -->
  <rect x="20" y="316" width="455" height="70" rx="8" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="36" y="340" font-size="13" font-weight="700" fill="#2b6cb0">真量化（推理）</text>
  <text x="36" y="362" font-size="11.5" fill="#555">FP32 ─quant→ INT8 存储/计算 ─dequant→ FP32 输出</text>
  <text x="36" y="380" font-size="11" fill="#888">反量化发生在「计算需要浮点时」：x̂ = (q - zp) × scale</text>

  <rect x="485" y="316" width="455" height="70" rx="8" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="501" y="340" font-size="13" font-weight="700" fill="#8e44ad">伪量化（训练）</text>
  <text x="501" y="362" font-size="11.5" fill="#555">FP32 ─quant→ INT8（概念）─dequant→ FP32（带误差）</text>
  <text x="501" y="380" font-size="11" fill="#888">让模型训练时就「感受」量化误差并适应 —— QAT 核心</text>
</svg>
