<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="450" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a1a1a">量化映射：浮点 → 整数的仿射变换</text>

  <!-- formula -->
  <rect x="20" y="48" width="920" height="56" rx="10" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="480" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#333">q = clip( round( <tspan fill="#2e86de">x</tspan> / <tspan fill="#C7000B">scale</tspan> ) + <tspan fill="#8e44ad">zero_point</tspan>,  q_min,  q_max )</text>
  <text x="480" y="96" text-anchor="middle" font-size="13" fill="#5a8c00" font-weight="700">反量化还原： x̂ = ( q − zero_point ) × scale</text>

  <!-- numeric example -->
  <text x="24" y="134" font-size="14" font-weight="700" fill="#333">数值示例：FP32 激活 [-0.8, 0.1, 1.5, 3.0] 用非对称 INT8（q∈[0,255]），scale≈0.0149, zp≈54</text>
  <rect x="20" y="146" width="920" height="26" rx="5" fill="#f2f4f7"/>
  <text x="40" y="164" font-size="12.5" font-weight="700" fill="#555">FP32 原值</text>
  <text x="230" y="164" font-size="12.5" font-weight="700" fill="#555">x / scale</text>
  <text x="420" y="164" font-size="12.5" font-weight="700" fill="#555">round + zp</text>
  <text x="600" y="164" font-size="12.5" font-weight="700" fill="#555">clip → q(int)</text>
  <text x="780" y="164" font-size="12.5" font-weight="700" fill="#555">反量化 / 误差</text>
  <g font-size="12.5">
    <g><rect x="20" y="172" width="920" height="26" fill="#f7fafd"/><text x="40" y="189" fill="#444">-0.80</text><text x="230" y="189" fill="#444">-53.69</text><text x="420" y="189" fill="#444">0.3</text><text x="600" y="189" fill="#2e86de" font-weight="700">0</text><text x="780" y="189" fill="#444">-0.805 / -0.005</text></g>
    <g><rect x="20" y="198" width="920" height="26" fill="#ffffff"/><text x="40" y="215" fill="#444">0.10</text><text x="230" y="215" fill="#444">6.71</text><text x="420" y="215" fill="#444">60.7</text><text x="600" y="215" fill="#2e86de" font-weight="700">61</text><text x="780" y="215" fill="#444">0.104 / +0.004</text></g>
    <g><rect x="20" y="224" width="920" height="26" fill="#f7fafd"/><text x="40" y="241" fill="#444">1.50</text><text x="230" y="241" fill="#444">100.67</text><text x="420" y="241" fill="#444">154.7</text><text x="600" y="241" fill="#2e86de" font-weight="700">155</text><text x="780" y="241" fill="#444">1.505 / +0.005</text></g>
    <g><rect x="20" y="250" width="920" height="26" fill="#ffffff"/><text x="40" y="267" fill="#444">3.00</text><text x="230" y="267" fill="#444">201.34</text><text x="420" y="267" fill="#444">255.3</text><text x="600" y="267" fill="#2e86de" font-weight="700">255</text><text x="780" y="267" fill="#444">2.995 / -0.005</text></g>
  </g>
  <rect x="20" y="172" width="920" height="104" rx="6" fill="none" stroke="#e3e6ea"/>
  <text x="24" y="294" font-size="11.5" fill="#888">4 个浮点值 → 整数格点 [0, 61, 155, 255]，还原误差均在 ±0.005 内（无极端异常值，scale 不大，量化「干净」）</text>

  <!-- error sources -->
  <text x="24" y="328" font-size="14" font-weight="700" fill="#333">精度损失来自两处，且相互矛盾</text>
  <rect x="20" y="340" width="455" height="92" rx="8" fill="#eef4ff" stroke="#2e86de"/>
  <text x="36" y="364" font-size="13" font-weight="700" fill="#2e86de">舍入误差（rounding）</text>
  <text x="36" y="388" font-size="12" fill="#555">round() 把连续值吸附到最近格点</text>
  <text x="36" y="408" font-size="12" fill="#555">最大 ±scale/2 → <tspan fill="#C7000B" font-weight="700">scale 越小越好</tspan></text>

  <rect x="485" y="340" width="455" height="92" rx="8" fill="#fdeeee" stroke="#C7000B"/>
  <text x="501" y="364" font-size="13" font-weight="700" fill="#C7000B">截断误差（clipping）</text>
  <text x="501" y="388" font-size="12" fill="#555">超出 [q_min, q_max] 的值被 clip 到边界</text>
  <text x="501" y="408" font-size="12" fill="#555">范围要盖住所有数据 → <tspan fill="#2e86de" font-weight="700">scale 越大越好</tspan></text>
  <text x="480" y="446" text-anchor="middle" font-size="12" fill="#888" font-weight="700">↑ 二者矛盾 → 校准(Calibration)就是在找最优 scale</text>
</svg>
