<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="760" height="170" fill="#f2f9e8" stroke="#5a8c00" rx="10"/>

  <!-- row 1: scale = (x_max - x_min)/(q_max - q_min) = (x_max - x_min)/255 -->
  <g font-size="18" fill="#1a1a1a">
    <text x="40" y="56">scale</text>
    <text x="92" y="56">=</text>
    <!-- frac1 -->
    <text x="236" y="48" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan><tspan font-size="10" dy="3">max</tspan><tspan dy="-3"> &#8722; </tspan><tspan font-style="italic">x</tspan><tspan font-size="10" dy="3">min</tspan></text>
    <line x1="130" y1="53" x2="342" y2="53" stroke="#1a1a1a" stroke-width="1.3"/>
    <text x="236" y="72" font-size="13" text-anchor="middle"><tspan font-style="italic">q</tspan><tspan font-size="10" dy="3">max</tspan><tspan dy="-3"> &#8722; </tspan><tspan font-style="italic">q</tspan><tspan font-size="10" dy="3">min</tspan></text>
    <text x="360" y="56">=</text>
    <!-- frac2 -->
    <text x="470" y="48" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan><tspan font-size="10" dy="3">max</tspan><tspan dy="-3"> &#8722; </tspan><tspan font-style="italic">x</tspan><tspan font-size="10" dy="3">min</tspan></text>
    <line x1="396" y1="53" x2="544" y2="53" stroke="#1a1a1a" stroke-width="1.3"/>
    <text x="470" y="72" font-size="13" text-anchor="middle">255</text>
  </g>

  <!-- row 2: zero_point = q_min - round(x_min/scale) = -round(x_min/scale) -->
  <g font-size="18" fill="#1a1a1a">
    <text x="40" y="138">zero_point</text>
    <text x="144" y="138">=</text>
    <text x="170" y="138" font-size="16"><tspan font-style="italic">q</tspan><tspan font-size="10" dy="3">min</tspan></text>
    <text x="212" y="138">&#8722;</text>
    <text x="236" y="138">round(</text>
    <!-- frac x_min/scale -->
    <text x="356" y="130" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan><tspan font-size="10" dy="3">min</tspan></text>
    <line x1="326" y1="135" x2="386" y2="135" stroke="#1a1a1a" stroke-width="1.3"/>
    <text x="356" y="152" font-size="13" text-anchor="middle">scale</text>
    <text x="392" y="138">)</text>
    <text x="414" y="138">=</text>
    <text x="440" y="138">&#8722;</text>
    <text x="462" y="138">round(</text>
    <text x="582" y="130" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan><tspan font-size="10" dy="3">min</tspan></text>
    <line x1="552" y1="135" x2="612" y2="135" stroke="#1a1a1a" stroke-width="1.3"/>
    <text x="582" y="152" font-size="13" text-anchor="middle">scale</text>
    <text x="618" y="138">)</text>
  </g>
</svg>
