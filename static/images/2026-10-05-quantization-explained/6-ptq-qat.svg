<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a1a1a">PTQ vs QAT：不重训 vs 边训边量化</text>

  <!-- PTQ flow -->
  <rect x="20" y="48" width="455" height="180" rx="10" fill="#eef4ff" stroke="#2e86de"/>
  <text x="40" y="76" font-size="15" font-weight="700" fill="#2e86de">PTQ 后训练量化（不动梯度）</text>
  <rect x="40" y="90" width="130" height="34" rx="6" fill="#dbeafe"/><text x="105" y="112" font-size="12" fill="#1a3a5c" text-anchor="middle" font-weight="700">已训练 FP32 模型</text>
  <path d="M 170 107 L 205 107" stroke="#2e86de" stroke-width="1.5" marker-end="url(#b1)"/>
  <rect x="208" y="90" width="247" height="34" rx="6" fill="#f0f6ff" stroke="#9cc3f0"/><text x="331" y="111" font-size="11" fill="#1a3a5c" text-anchor="middle">权重：直接 per-channel 对称量化</text>
  <rect x="208" y="132" width="247" height="34" rx="6" fill="#f0f6ff" stroke="#9cc3f0"/><text x="331" y="153" font-size="11" fill="#1a3a5c" text-anchor="middle">激活：128~512 条校准样本统计范围</text>
  <path d="M 331 166 L 331 185" stroke="#2e86de" stroke-width="1.5" marker-end="url(#b1)"/>
  <rect x="245" y="188" width="170" height="30" rx="6" fill="#2e86de"/><text x="330" y="208" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">INT8 模型</text>
  <text x="40" y="150" font-size="11" fill="#888">分钟级</text>
  <text x="40" y="168" font-size="11" fill="#888">一张卡</text>
  <text x="40" y="186" font-size="11" fill="#888">几百条数据</text>

  <!-- QAT flow -->
  <rect x="485" y="48" width="455" height="180" rx="10" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="505" y="76" font-size="15" font-weight="700" fill="#5a8c00">QAT 量化感知训练（插伪量化节点）</text>
  <rect x="505" y="96" width="415" height="40" rx="6" fill="#dcfce7"/>
  <text x="712" y="113" font-size="12" fill="#2f4a00" text-anchor="middle" font-weight="700">前向：x ─[round量化+反量化]→ x̂（带误差）→ 继续前向</text>
  <text x="712" y="130" font-size="11" fill="#555" text-anchor="middle">量化误差被注入，让模型提前适应</text>
  <rect x="505" y="146" width="415" height="40" rx="6" fill="#dcfce7"/>
  <text x="712" y="163" font-size="12" fill="#2f4a00" text-anchor="middle" font-weight="700">反向：梯度 ─[STE 直接穿过 round]→ 更新 FP32 权重</text>
  <text x="712" y="180" font-size="11" fill="#555" text-anchor="middle">STE 近似 round 的梯度为 1</text>
  <text x="712" y="212" font-size="12" fill="#5a8c00" text-anchor="middle" font-weight="700">微调几个 epoch 后，转为真正 INT8 推理模型</text>

  <!-- compare table -->
  <text x="24" y="262" font-size="14" font-weight="700" fill="#333">取舍对比</text>
  <rect x="20" y="274" width="920" height="28" rx="5" fill="#f2f4f7"/>
  <text x="40" y="293" font-size="12.5" font-weight="700" fill="#555">维度</text>
  <text x="300" y="293" font-size="12.5" font-weight="700" fill="#2e86de">PTQ</text>
  <text x="620" y="293" font-size="12.5" font-weight="700" fill="#5a8c00">QAT</text>
  <g font-size="12.5">
    <g><rect x="20" y="302" width="920" height="28" fill="#f7fafd"/><text x="40" y="320" fill="#444">成本</text><text x="300" y="320" fill="#444">低（几百条数据、分钟级）</text><text x="620" y="320" fill="#444">高（需训练数据 + 若干 epoch 微调）</text></g>
    <g><rect x="20" y="330" width="920" height="28" fill="#ffffff"/><text x="40" y="348" fill="#444">精度（INT8）</text><text x="300" y="348" fill="#444">通常够用</text><text x="620" y="348" fill="#444">略优</text></g>
    <g><rect x="20" y="358" width="920" height="28" fill="#f7fafd"/><text x="40" y="376" fill="#444">精度（INT4 及以下）</text><text x="300" y="376" fill="#C7000B">常明显掉点</text><text x="620" y="376" fill="#5a8c00" font-weight="700">明显更好</text></g>
    <g><rect x="20" y="386" width="920" height="28" fill="#ffffff"/><text x="40" y="404" fill="#444">适用</text><text x="300" y="404" fill="#444">大多数生产部署的首选</text><text x="620" y="404" fill="#444">低位宽、精度红线场景</text></g>
  </g>
  <rect x="20" y="302" width="920" height="112" rx="6" fill="none" stroke="#e3e6ea"/>
  <text x="24" y="438" font-size="12.5" fill="#C7000B" font-weight="700">经验法则：先上 PTQ，掉点能接受就不折腾；掉点超预算、或要压到 INT4，再上 QAT</text>

  <defs><marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2e86de"/></marker></defs>
</svg>
