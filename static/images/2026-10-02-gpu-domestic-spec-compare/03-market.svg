<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 970" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif">
  <rect width="1180" height="970" fill="#ffffff"/>

  <!-- ===== Header ===== -->
  <text x="590" y="56" text-anchor="middle" font-size="32" font-weight="800" fill="#1f2d3d">国产 GPU 落地应用场景与市场格局</text>
  <text x="590" y="90" text-anchor="middle" font-size="15" fill="#8a94a6">数据来源：公开年报 / 业绩快报、招投标公告，及 IDC / Bernstein / TrendForce 机构研报（截至 2026 年 10 月）</text>

  <!-- column divider -->
  <line x1="590" y1="150" x2="590" y2="930" stroke="#eef1f5" stroke-width="1"/>

  <!-- ================= LEFT COLUMN: scenarios ================= -->
  <text x="50" y="168" font-size="21" font-weight="700" fill="#1f2d3d">核心应用场景</text>

  <!-- Card 0 -->
  <rect x="50" y="186" width="525" height="136" rx="12" fill="#f7f8fa" stroke="#eef0f4" stroke-width="1"/>
  <rect x="50" y="186" width="6" height="136" rx="3" fill="#4f6ef7"/>
  <text x="78" y="222" font-size="16.5" font-weight="700" fill="#1f2d3d">电信运营商智算中心</text>
  <text x="78" y="246" font-size="13.5" fill="#6b7488">移动 / 电信 / 联通的 AI 服务器集采，是国产</text>
  <text x="78" y="268" font-size="13.5" fill="#6b7488">GPU 规模化落地的最大风向标。</text>
  <rect x="78" y="286" width="78" height="26" rx="7" fill="#f2634f"/><text x="117" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">华为昇腾</text>
  <rect x="176" y="286" width="78" height="26" rx="7" fill="#16a34a"/><text x="215" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">壁仞科技</text>
  <rect x="274" y="286" width="78" height="26" rx="7" fill="#2b8fe0"/><text x="313" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">海光信息</text>

  <!-- Card 1 -->
  <rect x="50" y="334" width="525" height="136" rx="12" fill="#f7f8fa" stroke="#eef0f4" stroke-width="1"/>
  <rect x="50" y="334" width="6" height="136" rx="3" fill="#4f6ef7"/>
  <text x="78" y="370" font-size="16.5" font-weight="700" fill="#1f2d3d">互联网大厂 AI 基础设施</text>
  <text x="78" y="394" font-size="13.5" fill="#6b7488">字节 / 百度 / 阿里自研芯片的同时，也大量采购</text>
  <text x="78" y="416" font-size="13.5" fill="#6b7488">国产 GPGPU 用于推荐、广告与大模型。</text>
  <rect x="78" y="434" width="62" height="26" rx="7" fill="#0fa697"/><text x="109" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">寒武纪</text>
  <rect x="150" y="434" width="78" height="26" rx="7" fill="#f2634f"/><text x="189" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">华为昇腾</text>
  <rect x="238" y="434" width="78" height="26" rx="7" fill="#16a34a"/><text x="277" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">壁仞科技</text>

  <!-- Card 2 -->
  <rect x="50" y="482" width="525" height="136" rx="12" fill="#f7f8fa" stroke="#eef0f4" stroke-width="1"/>
  <rect x="50" y="482" width="6" height="136" rx="3" fill="#4f6ef7"/>
  <text x="78" y="518" font-size="16.5" font-weight="700" fill="#1f2d3d">政务云与智算中心</text>
  <text x="78" y="542" font-size="13.5" fill="#6b7488">各地政府主导的智算中心多指定国产芯片，</text>
  <text x="78" y="564" font-size="13.5" fill="#6b7488">“东数西算”工程提供广阔增量空间。</text>
  <rect x="78" y="582" width="78" height="26" rx="7" fill="#f2634f"/><text x="117" y="600" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">华为昇腾</text>
  <rect x="176" y="582" width="78" height="26" rx="7" fill="#7b5cf6"/><text x="215" y="600" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">天数智芯</text>
  <rect x="274" y="582" width="78" height="26" rx="7" fill="#2b8fe0"/><text x="313" y="600" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">海光信息</text>

  <!-- Card 3 -->
  <rect x="50" y="630" width="525" height="136" rx="12" fill="#f7f8fa" stroke="#eef0f4" stroke-width="1"/>
  <rect x="50" y="630" width="6" height="136" rx="3" fill="#4f6ef7"/>
  <text x="78" y="666" font-size="16.5" font-weight="700" fill="#1f2d3d">金融与关键行业</text>
  <text x="78" y="690" font-size="13.5" fill="#6b7488">海光 DCU 凭 x86 生态兼容占优；量化交易 /</text>
  <text x="78" y="712" font-size="13.5" fill="#6b7488">风险分析对高精度计算要求高。</text>
  <rect x="78" y="730" width="78" height="26" rx="7" fill="#2b8fe0"/><text x="117" y="748" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">海光信息</text>
  <rect x="176" y="730" width="78" height="26" rx="7" fill="#16a34a"/><text x="215" y="748" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">壁仞科技</text>

  <!-- Card 4 -->
  <rect x="50" y="778" width="525" height="136" rx="12" fill="#f7f8fa" stroke="#eef0f4" stroke-width="1"/>
  <rect x="50" y="778" width="6" height="136" rx="3" fill="#4f6ef7"/>
  <text x="78" y="814" font-size="16.5" font-weight="700" fill="#1f2d3d">云游戏与云桌面</text>
  <text x="78" y="838" font-size="13.5" fill="#6b7488">摩尔线程 S 系列支持 vGPU 虚拟化，应用于</text>
  <text x="78" y="860" font-size="13.5" fill="#6b7488">云手机、云游戏、信创 PC 等场景。</text>
  <rect x="78" y="878" width="78" height="26" rx="7" fill="#d6468f"/><text x="117" y="896" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">摩尔线程</text>

  <!-- ================= RIGHT COLUMN ================= -->

  <!-- Section A: revenue -->
  <text x="605" y="168" font-size="21" font-weight="700" fill="#1f2d3d">2025 年营收对比（亿元 · 公开财报）</text>

  <!-- row 0: 海光信息 143.77 -->
  <rect x="712" y="196" width="418" height="34" rx="6" fill="#eef1f5"/>
  <rect x="712" y="196" width="418" height="34" rx="6" fill="#2b8fe0"/>
  <text x="605" y="218" font-size="14" fill="#3a4253">海光信息</text>
  <text x="1120" y="218" text-anchor="end" font-size="14" font-weight="700" fill="#ffffff">143.77</text>
  <!-- row 1: 寒武纪 64.97 -->
  <rect x="712" y="250" width="418" height="34" rx="6" fill="#eef1f5"/>
  <rect x="712" y="250" width="189" height="34" rx="6" fill="#0fa697"/>
  <text x="605" y="272" font-size="14" fill="#3a4253">寒武纪</text>
  <text x="889" y="272" text-anchor="end" font-size="14" font-weight="700" fill="#ffffff">64.97</text>
  <!-- row 2: 沐曦 16.44 -->
  <rect x="712" y="304" width="418" height="34" rx="6" fill="#eef1f5"/>
  <rect x="712" y="304" width="48" height="34" rx="6" fill="#8b5cf6"/>
  <text x="605" y="326" font-size="14" fill="#3a4253">沐曦</text>
  <text x="770" y="326" font-size="14" font-weight="700" fill="#6b7488">16.44</text>
  <!-- row 3: 摩尔线程 15.05 -->
  <rect x="712" y="358" width="418" height="34" rx="6" fill="#eef1f5"/>
  <rect x="712" y="358" width="44" height="34" rx="6" fill="#d6468f"/>
  <text x="605" y="380" font-size="14" fill="#3a4253">摩尔线程</text>
  <text x="766" y="380" font-size="14" font-weight="700" fill="#6b7488">15.05</text>

  <text x="605" y="414" font-size="12" fill="#9aa3b2">注：海光为 CPU+DCU 总营收，寒武纪含思元全线产品；壁仞 / 天数未上市，无公开年报故不列。</text>

  <!-- Section B: market share -->
  <text x="605" y="454" font-size="21" font-weight="700" fill="#1f2d3d">市场格局（第三方机构口径）</text>

  <rect x="605" y="472" width="252" height="104" rx="14" fill="#f7f9fc" stroke="#e7ebf2" stroke-width="1"/>
  <text x="731" y="526" text-anchor="middle" font-size="34" font-weight="800" fill="#2b6fe0">~165 万张</text>
  <text x="731" y="556" text-anchor="middle" font-size="12.5" fill="#6b7488">2025 国产 AI 加速卡出货 · IDC</text>

  <rect x="878" y="472" width="252" height="104" rx="14" fill="#f7f9fc" stroke="#e7ebf2" stroke-width="1"/>
  <text x="1004" y="526" text-anchor="middle" font-size="34" font-weight="800" fill="#2b6fe0">~41%</text>
  <text x="1004" y="556" text-anchor="middle" font-size="12.5" fill="#6b7488">国产占国内市场份额 · IDC</text>

  <rect x="605" y="596" width="252" height="104" rx="14" fill="#f7f9fc" stroke="#e7ebf2" stroke-width="1"/>
  <text x="731" y="650" text-anchor="middle" font-size="34" font-weight="800" fill="#2b6fe0">~50%</text>
  <text x="731" y="680" text-anchor="middle" font-size="12" fill="#6b7488">2026 华为昇腾份额 · Bernstein 预测</text>

  <rect x="878" y="596" width="252" height="104" rx="14" fill="#f7f9fc" stroke="#e7ebf2" stroke-width="1"/>
  <text x="1004" y="650" text-anchor="middle" font-size="34" font-weight="800" fill="#2b6fe0">~8%</text>
  <text x="1004" y="680" text-anchor="middle" font-size="12" fill="#6b7488">2026 英伟达份额 · TrendForce 预测</text>

  <!-- Section C: DeepSeek adaptation -->
  <text x="605" y="748" font-size="21" font-weight="700" fill="#1f2d3d">DeepSeek 适配情况</text>
  <text x="605" y="778" font-size="13.5" fill="#68718c">DeepSeek V3/V4 发布后，超百家厂商实现 “Day 0 接入”，</text>
  <text x="605" y="800" font-size="13.5" fill="#68718c">本文覆盖的 10 家国产厂商均已完成适配：</text>

  <rect x="605" y="820" width="46" height="30" rx="8" fill="#f2634f"/><text x="628" y="840" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">昇腾</text>
  <rect x="661" y="820" width="46" height="30" rx="8" fill="#8b5cf6"/><text x="684" y="840" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">沐曦</text>
  <rect x="717" y="820" width="46" height="30" rx="8" fill="#16a34a"/><text x="740" y="840" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">壁仞</text>
  <rect x="773" y="820" width="46" height="30" rx="8" fill="#7b5cf6"/><text x="796" y="840" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">天数</text>
  <rect x="829" y="820" width="78" height="30" rx="8" fill="#d6468f"/><text x="868" y="840" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">摩尔线程</text>
  <rect x="917" y="820" width="46" height="30" rx="8" fill="#2b8fe0"/><text x="940" y="840" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">海光</text>
  <rect x="973" y="820" width="46" height="30" rx="8" fill="#f5a623"/><text x="996" y="840" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">燧原</text>
  <rect x="1029" y="820" width="60" height="30" rx="8" fill="#f59e0b"/><text x="1059" y="840" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">昆仑芯</text>

  <rect x="605" y="860" width="60" height="30" rx="8" fill="#3b9fe0"/><text x="635" y="880" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">平头哥</text>
  <rect x="675" y="860" width="60" height="30" rx="8" fill="#0fa697"/><text x="705" y="880" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">寒武纪</text>
</svg>
