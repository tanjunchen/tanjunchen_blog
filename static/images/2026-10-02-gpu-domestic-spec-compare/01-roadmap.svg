  <text x="20" y="190" font-size="11" fill="#8a94a6">起步，首代AI芯片与创业潮</text>

  <rect x="190" y="150" width="310" height="92" rx="14" fill="#f2634f"/>
  <text x="345" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">昇腾910</text>
  <text x="345" y="214" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.92">7nm 达芬奇架构</text>
  <rect x="520" y="150" width="310" height="92" rx="14" fill="#ef8e35"/>
  <text x="675" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">昆仑1代</text>
  <text x="675" y="214" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.92">百度首款AI芯片</text>
