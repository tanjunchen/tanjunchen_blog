  <text x="345" y="296" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">天数智芯成立</text>
  <text x="345" y="322" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.92">启动GPGPU研发</text>
