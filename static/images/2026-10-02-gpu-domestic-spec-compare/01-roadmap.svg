  <!-- ===== Legend ===== -->
  <rect x="24" y="99" width="14" height="14" rx="3" fill="#f2634f"/><text x="44" y="111" font-size="13" fill="#3a4253">华为昇腾</text>
  <rect x="116" y="99" width="14" height="14" rx="3" fill="#0fa697"/><text x="136" y="111" font-size="13" fill="#3a4253">壁仞科技</text>
  <rect x="208" y="99" width="14" height="14" rx="3" fill="#6c5ce7"/><text x="228" y="111" font-size="13" fill="#3a4253">天数智芯</text>
  <rect x="300" y="99" width="14" height="14" rx="3" fill="#d6479b"/><text x="320" y="111" font-size="13" fill="#3a4253">摩尔线程</text>
  <rect x="392" y="99" width="14" height="14" rx="3" fill="#2f86d9"/><text x="412" y="111" font-size="13" fill="#3a4253">海光信息</text>
  <rect x="484" y="99" width="14" height="14" rx="3" fill="#12b886"/><text x="504" y="111" font-size="13" fill="#3a4253">寒武纪</text>
  <rect x="564" y="99" width="14" height="14" rx="3" fill="#9b6cf0"/><text x="584" y="111" font-size="13" fill="#3a4253">沐曦</text>
  <rect x="631" y="99" width="14" height="14" rx="3" fill="#ef8e35"/><text x="651" y="111" font-size="13" fill="#3a4253">百度昆仑芯</text>
  <rect x="736" y="99" width="14" height="14" rx="3" fill="#1f9bd6"/><text x="756" y="111" font-size="13" fill="#3a4253">阿里平头哥</text>
  <rect x="841" y="99" width="14" height="14" rx="3" fill="#f5a623"/><text x="861" y="111" font-size="13" fill="#3a4253">燧原科技</text>

  <!-- ===== Stage 1: 2018-2019 ===== -->
