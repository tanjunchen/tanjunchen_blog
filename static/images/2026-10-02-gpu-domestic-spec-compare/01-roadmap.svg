<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1920" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Helvetica Neue',Arial,sans-serif">
  <rect width="1180" height="1920" fill="#ffffff"/>

  <!-- ===== Header ===== -->
