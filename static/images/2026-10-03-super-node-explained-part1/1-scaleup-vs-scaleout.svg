<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Scale-up（纵向）vs Scale-out（横向）：两种扩展方向</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#888">超节点 = 把 Scale-up 域从「8 卡一机」做大到「几十上百卡一柜」</text>

  <rect x="30" y="74" width="405" height="340" rx="12" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="232" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#3a5c00">Scale-up 纵向扩展（超节点所在层）</text>
  <text x="232" y="122" text-anchor="middle" font-size="11.5" fill="#666">卡与卡之间：高带宽 · 低延迟 · 常全互联 · 可统一寻址</text>

  <g>
    <circle cx="130" cy="210" r="20" fill="#76b900"/><text x="130" y="214" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">GPU</text>
    <circle cx="232" cy="175" r="20" fill="#76b900"/><text x="232" y="179" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">GPU</text>
    <circle cx="334" cy="210" r="20" fill="#76b900"/><text x="334" y="214" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">GPU</text>
    <circle cx="130" cy="300" r="20" fill="#76b900"/><text x="130" y="304" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">GPU</text>
    <circle cx="232" cy="335" r="20" fill="#76b900"/><text x="232" y="339" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">GPU</text>
    <circle cx="334" cy="300" r="20" fill="#76b900"/><text x="334" y="304" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">GPU</text>
  </g>
  <g stroke="#9ac24a" stroke-width="1.4" opacity="0.9">
    <line x1="130" y1="210" x2="232" y2="175"/><line x1="232" y1="175" x2="334" y2="210"/>
    <line x1="130" y1="210" x2="334" y2="210"/><line x1="130" y1="210" x2="130" y2="300"/>
    <line x1="130" y1="210" x2="232" y2="335"/><line x1="130" y1="210" x2="334" y2="300"/>
    <line x1="232" y1="175" x2="130" y2="300"/><line x1="232" y1="175" x2="334" y2="300"/>
    <line x1="232" y1="175" x2="232" y2="335"/><line x1="334" y1="210" x2="130" y2="300"/>
    <line x1="334" y1="210" x2="232" y2="335"/><line x1="334" y1="210" x2="334" y2="300"/>
    <line x1="130" y1="300" x2="232" y2="335"/><line x1="232" y1="335" x2="334" y2="300"/>
    <line x1="130" y1="300" x2="334" y2="300"/>
  </g>
  <text x="232" y="385" text-anchor="middle" font-size="12" fill="#3a5c00" font-weight="700">任意两卡直连（all-to-all）· TB/s 级 · 亚微秒</text>
  <text x="232" y="403" text-anchor="middle" font-size="11" fill="#888">NVLink/NVSwitch、华为灵衢(UB)——私有高速总线</text>

  <rect x="465" y="74" width="405" height="340" rx="12" fill="#eef4ff" stroke="#2e86de"/>
  <text x="667" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5a9c">Scale-out 横向扩展（集群所在层）</text>
  <text x="667" y="122" text-anchor="middle" font-size="11.5" fill="#666">节点与节点之间：靠网络连接，带宽低一个量级</text>

  <g>
    <rect x="505" y="160" width="90" height="56" rx="8" fill="#2e86de"/><text x="550" y="193" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">节点/超节点</text>
    <rect x="625" y="160" width="90" height="56" rx="8" fill="#2e86de"/><text x="670" y="193" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">节点/超节点</text>
    <rect x="745" y="160" width="90" height="56" rx="8" fill="#2e86de"/><text x="790" y="193" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">节点/超节点</text>
    <rect x="565" y="300" width="210" height="40" rx="8" fill="#1a5a9c"/><text x="670" y="325" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">InfiniBand / RoCE 以太网交换机</text>
  </g>
  <g stroke="#7fb0e8" stroke-width="2">
    <line x1="550" y1="216" x2="640" y2="300"/><line x1="670" y1="216" x2="670" y2="300"/><line x1="790" y1="216" x2="700" y2="300"/>
  </g>
  <text x="667" y="372" text-anchor="middle" font-size="12" fill="#1a5a9c" font-weight="700">跨机互联 · 100~800 Gb/s/卡 · 微秒~几十微秒</text>
  <text x="667" y="392" text-anchor="middle" font-size="11" fill="#888">可扩展到上万卡，但带宽/延迟远不如 Scale-up 域内</text>

  <text x="450" y="440" text-anchor="middle" font-size="12.5" fill="#555">一句话：<tspan font-weight="700" fill="#333">Scale-up 决定「一个紧耦合域能放多大/多快」，Scale-out 决定「总规模能堆多多」。超节点把前者做大。</tspan></text>
</svg>
