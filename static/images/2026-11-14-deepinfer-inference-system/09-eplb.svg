<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="760" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">EPLB：冗余专家吸收热点，优化目标是每一步的最慢 rank</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">平均负载均衡不等于每步快；同步并行里，一步的耗时由最慢的 rank 决定</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><text x="56" y="140" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">每张卡多备 1 个冗余专家（Decode / EP64）</text><text x="56" y="164" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">384 / 64 = 6 个本卡专家 + 1 个冗余；冗余用来放热门专家的副本</text><rect x="56" y="196" width="124" height="98" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="118" y="216" font-size="10" font-weight="700" fill="#5B6472" text-anchor="middle" opacity="1.0">卡 0</text><rect x="64" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="92" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="120" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="148" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="64" y="256" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="92" y="256" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="120" y="256" width="22" height="22" rx="4" fill="#FFF7E6" stroke="#D97706" stroke-width="0.8"/><text x="118" y="288" font-size="8" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">6 个本卡 + 1 个冗余</text><rect x="196" y="196" width="124" height="98" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="258" y="216" font-size="10" font-weight="700" fill="#5B6472" text-anchor="middle" opacity="1.0">卡 1</text><rect x="204" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="232" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="260" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="288" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="204" y="256" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="232" y="256" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="260" y="256" width="22" height="22" rx="4" fill="#DC2626" stroke="#DC2626" stroke-width="0.8"/><text x="258" y="288" font-size="8" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">6 个本卡 + 1 个冗余</text><rect x="336" y="196" width="124" height="98" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="398" y="216" font-size="10" font-weight="700" fill="#5B6472" text-anchor="middle" opacity="1.0">卡 2</text><rect x="344" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="372" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="400" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="428" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="344" y="256" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="372" y="256" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="400" y="256" width="22" height="22" rx="4" fill="#FFF7E6" stroke="#D97706" stroke-width="0.8"/><text x="398" y="288" font-size="8" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">6 个本卡 + 1 个冗余</text><rect x="476" y="196" width="124" height="98" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="538" y="216" font-size="10" font-weight="700" fill="#5B6472" text-anchor="middle" opacity="1.0">卡 3</text><rect x="484" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="512" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="540" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="568" y="228" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="484" y="256" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="512" y="256" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="540" y="256" width="22" height="22" rx="4" fill="#FFF7E6" stroke="#D97706" stroke-width="0.8"/><text x="538" y="288" font-size="8" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">6 个本卡 + 1 个冗余</text><rect x="56" y="316" width="124" height="98" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="118" y="336" font-size="10" font-weight="700" fill="#5B6472" text-anchor="middle" opacity="1.0">卡 4</text><rect x="64" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="92" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="120" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="148" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="64" y="376" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="92" y="376" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="120" y="376" width="22" height="22" rx="4" fill="#FFF7E6" stroke="#D97706" stroke-width="0.8"/><text x="118" y="408" font-size="8" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">6 个本卡 + 1 个冗余</text><rect x="196" y="316" width="124" height="98" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="258" y="336" font-size="10" font-weight="700" fill="#5B6472" text-anchor="middle" opacity="1.0">卡 5</text><rect x="204" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="232" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="260" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="288" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="204" y="376" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="232" y="376" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="260" y="376" width="22" height="22" rx="4" fill="#DC2626" stroke="#DC2626" stroke-width="0.8"/><text x="258" y="408" font-size="8" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">6 个本卡 + 1 个冗余</text><rect x="336" y="316" width="124" height="98" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="398" y="336" font-size="10" font-weight="700" fill="#5B6472" text-anchor="middle" opacity="1.0">卡 6</text><rect x="344" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="372" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="400" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="428" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="344" y="376" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="372" y="376" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="400" y="376" width="22" height="22" rx="4" fill="#FFF7E6" stroke="#D97706" stroke-width="0.8"/><text x="398" y="408" font-size="8" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">6 个本卡 + 1 个冗余</text><rect x="476" y="316" width="124" height="98" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="538" y="336" font-size="10" font-weight="700" fill="#5B6472" text-anchor="middle" opacity="1.0">卡 7</text><rect x="484" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="512" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="540" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="568" y="348" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="484" y="376" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="512" y="376" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="0.8"/><rect x="540" y="376" width="22" height="22" rx="4" fill="#FFF7E6" stroke="#D97706" stroke-width="0.8"/><text x="538" y="408" font-size="8" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">6 个本卡 + 1 个冗余</text><text x="56" y="446" font-size="10" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">红色 = 热门专家的两个副本；统计最近 N 步负载，每 M 步重排一次，</text><text x="56" y="464" font-size="10" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">专家权重经 NVLink symm_mem 在组内 shuffle。</text><text x="640" y="140" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">一步之内，8 个 rank 的负载并不相等</text><text x="640" y="164" font-size="10" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">优化目标不是「平均负载最小」，而是「历史窗口内每步最大负载之和最小」</text><rect x="660" y="330" width="42" height="16.87500000000004" rx="5" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="681" y="358.87500000000006" font-size="9" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">-1.9%</text><text x="681" y="430" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">R0</text><rect x="716" y="328.875" width="42" height="1.124999999999976" rx="5" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="737" y="321.875" font-size="9" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">+0.1%</text><text x="737" y="430" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">R1</text><rect x="772" y="330" width="42" height="25.87500000000005" rx="5" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="793" y="367.87500000000006" font-size="9" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">-2.9%</text><text x="793" y="430" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">R2</text><rect x="828" y="319.875" width="42" height="10.124999999999984" rx="5" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="849" y="312.875" font-size="9" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">+1.1%</text><text x="849" y="430" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">R3</text><rect x="884" y="256.875" width="42" height="73.12500000000003" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/><text x="905" y="249.875" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle" opacity="1.0">+8.1%</text><text x="905" y="430" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">R4</text><rect x="940" y="330" width="42" height="34.87500000000006" rx="5" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="961" y="376.87500000000006" font-size="9" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">-3.9%</text><text x="961" y="430" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">R5</text><rect x="996" y="330" width="42" height="7.875000000000032" rx="5" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="1017" y="349.87500000000006" font-size="9" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">-0.9%</text><text x="1017" y="430" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">R6</text><rect x="1052" y="328.875" width="42" height="1.124999999999976" rx="5" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="1073" y="321.875" font-size="9" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">+0.1%</text><text x="1073" y="430" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">R7</text><line x1="650" y1="330" x2="1120" y2="330" stroke="#0E9F6E" stroke-width="1.6" stroke-dasharray="4 4"/><text x="1124" y="334" font-size="9" font-weight="700" fill="#0E9F6E" text-anchor="start" opacity="1.0">均值</text><text x="900" y="190" font-size="12" font-weight="800" fill="#DC2626" text-anchor="middle" opacity="1.0">moe_lb = 最慢 rank / 均值 ≈ 1.09</text><text x="900" y="212" font-size="10" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">最慢的 R4 决定这一步的耗时</text><text x="640" y="458" font-size="10" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">把热点专家复制到空闲卡，把 R4 的偏差压回 ±2%，</text><text x="640" y="476" font-size="10" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">max 下降，整步就快 —— 这是「最大负载」目标与「平均负载」目标的差别。</text><rect x="56" y="500" width="1088" height="196" rx="12" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="78" y="530" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">Prefill 与 Decode 的 EPLB 参数：为什么一个 4 个冗余，一个 1 个？</text><text x="78" y="562" font-size="11" font-weight="800" fill="#5B6472" text-anchor="start" opacity="1.0"></text><text x="420" y="562" font-size="11" font-weight="800" fill="#5B6472" text-anchor="start" opacity="1.0">Prefill</text><text x="760" y="562" font-size="11" font-weight="800" fill="#5B6472" text-anchor="start" opacity="1.0">Decode</text><line x1="78" y1="572" x2="1124" y2="572" stroke="#EEF1F6" stroke-width="1"/><text x="78" y="588" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">每卡冗余专家</text><text x="420" y="588" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">4 个</text><text x="760" y="588" font-size="11" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">1 个</text><line x1="78" y1="596" x2="1124" y2="596" stroke="#EEF1F6" stroke-width="1"/><text x="78" y="612" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">统计窗</text><text x="420" y="612" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">100 步</text><text x="760" y="612" font-size="11" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">1000 步</text><line x1="78" y1="620" x2="1124" y2="620" stroke="#EEF1F6" stroke-width="1"/><text x="78" y="636" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">重排周期</text><text x="420" y="636" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">1000 步</text><text x="760" y="636" font-size="11" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">10000 步</text><line x1="78" y1="644" x2="1124" y2="644" stroke="#EEF1F6" stroke-width="1"/><text x="78" y="660" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">实测 moe_lb</text><text x="420" y="660" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">1.045 ~ 1.074</text><text x="760" y="660" font-size="11" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">1.090</text><text x="78" y="684" font-size="10" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">Prefill batch 大、专家负载波动剧烈，需要更多冗余吸收热点；Decode batch 小、负载平稳，1 个就够。</text><text x="56" y="736" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">一句话：冗余专家是「用显存换均衡」；目标函数选 max 而不是 mean，指标才会真的变好。</text></svg>