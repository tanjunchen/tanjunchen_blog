<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="660" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">384 个路由专家：EP8 每卡 52 个，EP64 每卡 7 个</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">每卡每步要读的专家权重，正比于「本地专家数」；Wide-EP 直接把这一项除以 7.4</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><text x="56" y="140" font-size="18" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">EP8（Prefill 典型）</text><text x="56" y="164" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">384 / 8 = 48 个本卡专家 + 4 个冗余 = 52</text><rect x="56" y="180" width="100" height="72" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="106" y="208" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">卡 0</text><text x="106" y="234" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">48 + 4</text><rect x="166" y="180" width="100" height="72" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="216" y="208" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">卡 1</text><text x="216" y="234" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">48 + 4</text><rect x="276" y="180" width="100" height="72" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="326" y="208" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">卡 2</text><text x="326" y="234" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">48 + 4</text><rect x="386" y="180" width="100" height="72" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="436" y="208" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">卡 3</text><text x="436" y="234" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">48 + 4</text><rect x="496" y="180" width="100" height="72" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="546" y="208" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">卡 4</text><text x="546" y="234" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">48 + 4</text><rect x="606" y="180" width="100" height="72" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="656" y="208" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">卡 5</text><text x="656" y="234" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">48 + 4</text><rect x="716" y="180" width="100" height="72" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="766" y="208" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">卡 6</text><text x="766" y="234" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">48 + 4</text><rect x="826" y="180" width="100" height="72" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="876" y="208" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">卡 7</text><text x="876" y="234" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">48 + 4</text><text x="56" y="302" font-size="18" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">EP64（Decode 典型）</text><text x="56" y="326" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">384 / 64 = 6 个本卡专家 + 1 个冗余 = 7；8 个代表卡，实际 64 卡一组</text><rect x="56" y="342" width="100" height="72" rx="10" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><text x="106" y="370" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">卡 0–7</text><text x="106" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">6 + 1</text><rect x="166" y="342" width="100" height="72" rx="10" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><text x="216" y="370" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">卡 8–15</text><text x="216" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">6 + 1</text><rect x="276" y="342" width="100" height="72" rx="10" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><text x="326" y="370" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">卡 16–23</text><text x="326" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">6 + 1</text><rect x="386" y="342" width="100" height="72" rx="10" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><text x="436" y="370" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">卡 24–31</text><text x="436" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">6 + 1</text><rect x="496" y="342" width="100" height="72" rx="10" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><text x="546" y="370" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">卡 32–39</text><text x="546" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">6 + 1</text><rect x="606" y="342" width="100" height="72" rx="10" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><text x="656" y="370" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">卡 40–47</text><text x="656" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">6 + 1</text><rect x="716" y="342" width="100" height="72" rx="10" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><text x="766" y="370" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">卡 48–55</text><text x="766" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">6 + 1</text><rect x="826" y="342" width="100" height="72" rx="10" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><text x="876" y="370" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">卡 56–63</text><text x="876" y="396" font-size="17" font-weight="800" fill="#14171F" text-anchor="middle" opacity="1.0">6 + 1</text><text x="960" y="140" font-size="13" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">每步专家权重（相对值）</text><text x="960" y="190" font-size="11" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">EP8</text><rect x="1008" y="176" width="96.0" height="22" rx="5" fill="#3D5AFE" stroke="#3D5AFE" stroke-width="0"/><text x="1111.0" y="192" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">52</text><text x="960" y="244" font-size="11" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">EP64</text><rect x="1008" y="230" width="12.923076923076923" height="22" rx="5" fill="#D97706" stroke="#D97706" stroke-width="0"/><text x="1027.923076923077" y="246" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">7</text><text x="960" y="298" font-size="11" font-weight="800" fill="#0E9F6E" text-anchor="start" opacity="1.0">EP128</text><rect x="1008" y="284" width="7.384615384615385" height="22" rx="5" fill="#0E9F6E" stroke="#0E9F6E" stroke-width="0"/><text x="1022.3846153846154" y="300" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">4</text><text x="960" y="352" font-size="13" font-weight="800" fill="#DC2626" text-anchor="start" opacity="1.0">52 / 7 ≈ 7.4×</text><text x="960" y="374" font-size="13" font-weight="800" fill="#DC2626" text-anchor="start" opacity="1.0">52 / 4 = 13×</text><text x="960" y="400" font-size="10" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">EP128 为公式外推</text><rect x="56" y="466" width="1088" height="152" rx="12" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="78" y="498" font-size="16" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">为什么 Decode 特别吃这一项？</text><text x="78" y="528" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">Prefill 一步有几千个 token，同一份专家权重被反复复用；Decode 一步每卡只有约 60 并发，</text><text x="78" y="552" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">每个专家分到的 token 很少，权重却要整块从 HBM 读进来。本地专家数从 52 降到 7，</text><text x="78" y="576" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">等于把「每步必须搬的权重」砍掉 7.4 倍 —— 这就是 Wide-EP 在 Decode 侧最直接的收益。</text><rect x="880" y="484" width="244" height="116" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="900" y="512" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">本地专家数</text><text x="900" y="540" font-size="17" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">= 384 / EP + 冗余</text><text x="900" y="566" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">冗余：P 4 个 / D 1 个</text><text x="900" y="586" font-size="10" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">冗余专家用来放热点副本</text></svg>