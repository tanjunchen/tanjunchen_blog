<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="660" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">3FS + GDR：把「取缓存」变成一次不占 SM 的 DMA</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">10+2 纠删码保证可用性，GDR 让 KV 换入与 GPU 前向计算真正并行</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><text x="56" y="140" font-size="16" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">10+2 纠删码：任意 10 个响应即可解码</text><text x="56" y="164" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">一个 EC 组 12 块，容忍 2 个存储节点同时故障</text><rect x="56" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="76" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="76" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">1</text><rect x="102" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="122" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="122" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">2</text><rect x="148" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="168" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="168" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">3</text><rect x="194" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="214" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="214" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">4</text><rect x="240" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="260" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="260" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">5</text><rect x="286" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="306" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="306" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">6</text><rect x="332" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="352" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="352" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">7</text><rect x="378" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="398" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="398" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">8</text><rect x="424" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="444" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="444" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">9</text><rect x="470" y="186" width="40" height="62" rx="8" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="490" y="214" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">D</text><text x="490" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">10</text><rect x="516" y="186" width="40" height="62" rx="8" fill="#FFF7E6" stroke="#D97706" stroke-width="1.2"/><text x="536" y="214" font-size="13" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">P</text><text x="536" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">11</text><rect x="562" y="186" width="40" height="62" rx="8" fill="#FFF7E6" stroke="#D97706" stroke-width="1.2"/><text x="582" y="214" font-size="13" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">P</text><text x="582" y="236" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">12</text><rect x="300" y="312" width="240" height="54" rx="10" fill="#FFFFFF" stroke="#0E9F6E" stroke-width="1.4"/><text x="420" y="336" font-size="14" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">任意 10 个块 → 解码</text><text x="420" y="354" font-size="10" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">恢复完整 KV block</text><line x1="122" y1="250" x2="420" y2="310" stroke="#0E9F6E" stroke-width="1.1" marker-end="url(#ar-teal)" stroke-dasharray="3 3"/><line x1="214" y1="250" x2="420" y2="310" stroke="#0E9F6E" stroke-width="1.1" marker-end="url(#ar-teal)" stroke-dasharray="3 3"/><line x1="306" y1="250" x2="420" y2="310" stroke="#0E9F6E" stroke-width="1.1" marker-end="url(#ar-teal)" stroke-dasharray="3 3"/><line x1="398" y1="250" x2="420" y2="310" stroke="#0E9F6E" stroke-width="1.1" marker-end="url(#ar-teal)" stroke-dasharray="3 3"/><line x1="490" y1="250" x2="420" y2="310" stroke="#0E9F6E" stroke-width="1.1" marker-end="url(#ar-teal)" stroke-dasharray="3 3"/><line x1="582" y1="250" x2="420" y2="310" stroke="#0E9F6E" stroke-width="1.1" marker-end="url(#ar-teal)" stroke-dasharray="3 3"/><text x="56" y="388" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">读时同时向组内 11 台 Storage 发请求，</text><text x="56" y="406" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">快者先得，慢节点不拖尾。</text><rect x="56" y="430" width="484" height="96" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="76" y="460" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">GC Worker</text><text x="76" y="486" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">每个 Storage 节点一个实例，按 LRU 周期淘汰最久未访问的</text><text x="76" y="506" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">KVCache，把磁盘占用压在水位线以下。</text><text x="640" y="140" font-size="16" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">数据路径：从 3FS 到 HBM，三段各自异步</text><rect x="640" y="176" width="504" height="76" rx="12" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1.2"/><text x="660" y="206" font-size="15" font-weight="800" fill="#0E9F6E" text-anchor="start" opacity="1.0">① 3FS</text><text x="660" y="232" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">Block KV ~112 KiB 粒度随机读</text><line x1="892" y1="252" x2="892" y2="276" stroke="#0E9F6E" stroke-width="2" marker-end="url(#ar-teal)"/><rect x="640" y="276" width="504" height="76" rx="12" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="660" y="306" font-size="15" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">② 宿主机 shm</text><text x="660" y="332" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">独立进程异步搬运，不阻塞 engine</text><line x1="892" y1="352" x2="892" y2="376" stroke="#3D5AFE" stroke-width="2" marker-end="url(#ar-blue)"/><rect x="640" y="376" width="504" height="76" rx="12" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/><text x="660" y="406" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="start" opacity="1.0">③ HBM</text><text x="660" y="432" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">GDR 逐层 H2D，与前向计算 overlap</text><text x="640" y="486" font-size="13" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">时间线：换入与前向重叠，GPU 不等 KV</text><rect x="640" y="500" width="504" height="26" rx="5" fill="#EEF1F6" stroke="#EEF1F6" stroke-width="0"/><rect x="640" y="500" width="150" height="26" rx="5" fill="#0E9F6E" stroke="#0E9F6E" stroke-width="0"/><text x="715" y="518" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">取 KV</text><rect x="790" y="500" width="130" height="26" rx="5" fill="#3D5AFE" stroke="#3D5AFE" stroke-width="0"/><text x="855" y="518" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">GDR 换入</text><rect x="800" y="532" width="344" height="26" rx="5" fill="#7C3AED" stroke="#7C3AED" stroke-width="0"/><text x="972" y="550" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">前向计算</text><text x="640" y="584" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">关键点：CUDA copy engine 对 112 KiB 小块拷贝性能不佳；</text><text x="640" y="604" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">GDR 走 RDMA 网卡直接 DMA，能打满 PCIe，且不占 SM。</text><text x="56" y="628" font-size="11" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">跨机房补充：每 8 张卡约需 400 Gbps 互联带宽；P/D 可跨相邻机房部署，代价是光纤故障风险。</text></svg>