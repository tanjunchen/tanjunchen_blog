<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="860" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">SWA Bounded Replay：只回放最后 128 个 token，把重算代价变成常数</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">滑动窗口只关心最近 128 个 token；精确重建的误差会沿层传播，每层多 128 token，20 层就是 2560</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><text x="56" y="132" font-size="15" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">V4 的做法：SWA 也落盘，未命中时精确重算</text><rect x="56" y="146" width="1088" height="34" rx="8" fill="#FFF7E6" stroke="#D97706" stroke-width="1"/><text x="76" y="168" font-size="12" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">SWA KVCache 持久化（曾占持久 KVCache 近一半容量）</text><text x="56" y="202" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">但 SWA 只在会话内分钟级复用，会话结束即失效 —— 存得多，命中少。</text><text x="56" y="242" font-size="15" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">V4.1 的做法：SWA 不进 3FS，缺失时只回放最后 128 个 token</text><rect x="56" y="256" width="1088" height="34" rx="8" fill="#F7F9FC" stroke="#DCE3EC" stroke-width="1"/><rect x="56" y="256" width="940" height="34" rx="8" fill="#E9EDF5" stroke="#C9D2E0" stroke-width="0"/><rect x="996" y="256" width="148" height="34" rx="8" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.4"/><text x="76" y="278" font-size="12" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">Block KV 仍在 3FS，可跨请求复用</text><text x="1070" y="278" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="middle" opacity="1.0">只回放 128</text><text x="56" y="312" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">代价与上下文长度、层数无关；SWA 命中率 &gt;98%，未命中才触发。</text><text x="56" y="356" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">为什么精确重建要 2560 个 token？——误差锥</text><rect x="76" y="380" width="600" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="389" width="570" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="398" width="540" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="407" width="510" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="416" width="480" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="425" width="450" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="434" width="420" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="443" width="390" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="452" width="360" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="461" width="330" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="470" width="300" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="479" width="270" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="488" width="240" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="497" width="210" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="506" width="180" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="515" width="150" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="524" width="120" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="533" width="90" height="6" rx="2" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="542" width="60" height="6" rx="2" fill="#C7D2FE" stroke="#B9C6EE" stroke-width="0.6"/><rect x="76" y="551" width="30" height="6" rx="2" fill="#C7D2FE" stroke="#B9C6EE" stroke-width="0.6"/><text x="76" y="372" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">第 20 层：需要 2560</text><text x="76" y="584" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">第 1 层：128</text><rect x="676" y="380" width="5" height="171" rx="2" fill="#DC2626" stroke="#DC2626" stroke-width="0"/><text x="676" y="372" font-size="11" font-weight="800" fill="#DC2626" text-anchor="middle" opacity="1.0">精确重建 2560</text><rect x="646" y="380" width="30" height="171" rx="3" fill="#3D5AFE" stroke="#3D5AFE" stroke-width="0"/><text x="646" y="600" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">Bounded Replay 只回放这 128 个</text><rect x="760" y="350" width="384" height="230" rx="12" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="780" y="380" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">误差锥怎么来的？</text><text x="780" y="410" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">第 1 层最后 128 个 token 的输出，依赖前 128 个输入；</text><text x="780" y="434" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">第 2 层要精确，就得把这 128 个位置在第 1 层也算准；</text><text x="780" y="458" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">每往上一层，边界多影响 128 个 token，20 层累积 2560。</text><text x="780" y="506" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">Bounded Replay 不补这条锥，只回放最后 128 个 token：</text><text x="780" y="530" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">边界近似，但代价从 O(层数 × 窗口) 变成 O(窗口)。</text><text x="56" y="636" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">命中长度怎么算？——L = 10,000 的例子（示意，非等比）</text><rect x="56" y="662" width="500" height="36" rx="6" fill="#E9EDF5" stroke="#C9D2E0" stroke-width="1.2"/><rect x="556" y="662" width="140" height="36" rx="6" fill="#DCE3F7" stroke="#B9C6EE" stroke-width="1.2"/><rect x="696" y="662" width="180" height="36" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><rect x="876" y="662" width="100" height="36" rx="6" fill="#FFF7E6" stroke="#D97706" stroke-width="1.2"/><rect x="976" y="662" width="168" height="36" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/><text x="70" y="685" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">0 … 9,472</text><text x="566" y="685" font-size="10" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">9,472–9,600</text><text x="706" y="685" font-size="10" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">9,600–9,728</text><text x="886" y="685" font-size="9" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">9,728–9,866</text><text x="986" y="685" font-size="9" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1.0">9,866–10,000</text><text x="696" y="650" font-size="11" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">Block 命中 L1 = 9,728</text><text x="876" y="650" font-size="11" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">最大命中 L-134 = 9,866</text><text x="976" y="718" font-size="11" font-weight="700" fill="#DC2626" text-anchor="start" opacity="1.0">尾部 134 必须留出</text><text x="56" y="744" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">① 先查 Block KV：L1 必须是 128 的整数倍。</text><text x="56" y="768" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">② 再查 [L1-128, L1] 内有没有 SWA：有 → 命中 L1；没有 → 退一个 block 到 9,600，重算最后 128 个 token。</text><text x="56" y="792" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">③ 上限 L-134：窗口 128 + 投机回退 6；命中再长，尾部也没有足够空间重建 SWA。</text><text x="56" y="828" font-size="13" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">一句话：Block KV 决定「能命中多长」，SWA KV 决定「最后一个 block 要不要退」。</text></svg>