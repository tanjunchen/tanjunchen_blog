<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="760" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">38 美金/卡·时的成本拆解：钱花在哪，毛利从哪来</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">以下为第三方测算，不是 DeepSeek 官方成本数据；谷价、折旧年限、电价、PUE 均为假设，只用于判断量级</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><text x="56" y="140" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">单卡小时收入 $38（谷价）</text><rect x="56" y="156" width="500" height="46" rx="10" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.4"/><text x="76" y="186" font-size="20" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">$38 / card·hour</text><text x="420" y="186" font-size="12" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">100%</text><text x="56" y="238" font-size="13" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">单卡小时成本 ≈ $2–2.5（下图放大 15× 显示）</text><rect x="56" y="254" width="290.0" height="46" rx="0" fill="#EEF2FF" stroke="#4D6BFE" stroke-width="1"/><text x="201.0" y="282" font-size="10" font-weight="700" fill="#4D6BFE" text-anchor="middle" opacity="1.0">卡本身</text><rect x="346.0" y="254" width="24.0" height="46" rx="0" fill="#FFF7E6" stroke="#F59E0B" stroke-width="1"/><rect x="370.0" y="254" width="80.0" height="46" rx="0" fill="#E8F7F1" stroke="#0E9F6E" stroke-width="1"/><text x="410.0" y="282" font-size="10" font-weight="700" fill="#0E9F6E" text-anchor="middle" opacity="1.0">基础设施</text><rect x="450.0" y="254" width="106.0" height="46" rx="0" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/><text x="503.0" y="282" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" opacity="1.0">余量</text><rect x="56" y="254" width="500" height="46" rx="10" fill="none" stroke="#DCE3EC" stroke-width="1.2"/><circle cx="64" cy="322" r="5" fill="#4D6BFE" stroke="none" stroke-width="0"/><text x="78" y="326" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">卡本身  $1.45</text><circle cx="64" cy="346" r="5" fill="#F59E0B" stroke="none" stroke-width="0"/><text x="78" y="350" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">电费  $0.12</text><circle cx="64" cy="370" r="5" fill="#0E9F6E" stroke="none" stroke-width="0"/><text x="78" y="374" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">基础设施  $0.40</text><circle cx="64" cy="394" r="5" fill="#94A3B8" stroke="none" stroke-width="0"/><text x="78" y="398" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">余量  $0.53</text><text x="320" y="326" font-size="12" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">合计 ≈ $2.5</text><text x="320" y="350" font-size="12" font-weight="800" fill="#0E9F6E" text-anchor="start" opacity="1.0">毛利 ≈ $35.5–36 / 卡·时</text><text x="320" y="374" font-size="15" font-weight="800" fill="#0E9F6E" text-anchor="start" opacity="1.0">毛利率 ≈ 93–95%</text><rect x="620" y="140" width="524" height="240" rx="12" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="644" y="172" font-size="13" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">V3/R1  vs  V4.1 Flash（第三方推算）</text><text x="644" y="204" font-size="10" font-weight="800" fill="#5B6472" text-anchor="start" opacity="1.0"></text><text x="840" y="204" font-size="10" font-weight="800" fill="#5B6472" text-anchor="start" opacity="1.0">V3 / R1</text><text x="1010" y="204" font-size="10" font-weight="800" fill="#5B6472" text-anchor="start" opacity="1.0">V4.1</text><line x1="644" y1="214" x2="1120" y2="214" stroke="#EEF1F6" stroke-width="1"/><text x="644" y="230" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">卡数</text><text x="840" y="230" font-size="11" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">~1,800</text><text x="1010" y="230" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">~7,300</text><line x1="644" y1="242" x2="1120" y2="242" stroke="#EEF1F6" stroke-width="1"/><text x="644" y="258" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">单卡小时收入</text><text x="840" y="258" font-size="11" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">$13</text><text x="1010" y="258" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">$38</text><line x1="644" y1="270" x2="1120" y2="270" stroke="#EEF1F6" stroke-width="1"/><text x="644" y="286" font-size="11" font-weight="600" fill="#5B6472" text-anchor="start" opacity="1.0">日收入</text><text x="840" y="286" font-size="11" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">~$0.56M</text><text x="1010" y="286" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">~$6.7M</text><text x="644" y="336" font-size="10" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">单价降了，单卡收入反而涨 —— 靠的是缓存命中、稀疏注意力与投机解码。</text><text x="644" y="356" font-size="10" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">年化收入量级：7300 × $38 × 24 × 365 ≈ $2.4B（谷价）。</text><rect x="620" y="396" width="524" height="130" rx="10" fill="#F7F9FC" stroke="#E6EBF3" stroke-width="1"/><text x="640" y="424" font-size="12" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">两种拿卡方式</text><text x="640" y="450" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">自有 GB200/B200：成本 $2–2.5 → 毛利率 ~94%</text><text x="640" y="472" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">租 B200：$5–7 → 毛利率 82–87%</text><text x="640" y="500" font-size="10" font-weight="400" fill="#8A94A6" text-anchor="start" opacity="1.0">长期服务下，买卡相对租卡有约 2–3 倍成本优势。</text><rect x="56" y="548" width="1088" height="142" rx="12" fill="#FEF2F2" stroke="#F5C2C7" stroke-width="1.2"/><text x="78" y="578" font-size="14" font-weight="800" fill="#DC2626" text-anchor="start" opacity="1.0">口径提醒：这不是官方成本表</text><text x="78" y="604" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">谷价、4 年折旧、¥0.6/度电价、PUE 1.4、100 PiB 存储等均为第三方假设；成本口径上，官方只披露了「155 万亿 tokens/天」与「$38/卡·时」。</text><text x="78" y="626" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">这些数字适合判断量级与敏感性，不适合当作财务核算。真正决定毛利的是：拿卡价格、电价、在线效率（≈离线 80%）与 P:D 配比（≈1:1）。</text><text x="78" y="650" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">敏感性：在线效率每掉 10 个百分点，或 P:D 明显偏离 1:1，单卡收入就会显著低于 $38 —— 同样的卡，收益差距出在调度与配比上。</text><text x="56" y="722" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">一句话：$38 不是「卡贵」，是「调度把卡用满了」；成本结构里真正的大头只有卡和电。</text></svg>