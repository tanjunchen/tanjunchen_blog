<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">Prefill 计算密集、Decode 访存密集：一条 roofline，解释两种相反的 EP 策略</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">横轴是算术强度（每读 1 字节做多少次运算），纵轴是可达性能；两个阶段的落点根本不在同一个位置</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><rect x="86" y="150" width="564" height="370" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1"/><line x1="86" y1="224.0" x2="650" y2="224.0" stroke="#EEF1F6" stroke-width="1"/><line x1="86" y1="298.0" x2="650" y2="298.0" stroke="#EEF1F6" stroke-width="1"/><line x1="86" y1="372.0" x2="650" y2="372.0" stroke="#EEF1F6" stroke-width="1"/><line x1="86" y1="446.0" x2="650" y2="446.0" stroke="#EEF1F6" stroke-width="1"/><line x1="198.8" y1="150" x2="198.8" y2="520" stroke="#EEF1F6" stroke-width="1"/><line x1="311.6" y1="150" x2="311.6" y2="520" stroke="#EEF1F6" stroke-width="1"/><line x1="424.4" y1="150" x2="424.4" y2="520" stroke="#EEF1F6" stroke-width="1"/><line x1="537.2" y1="150" x2="537.2" y2="520" stroke="#EEF1F6" stroke-width="1"/><text x="368.0" y="548" font-size="13" font-weight="600" fill="#5B6472" text-anchor="middle" opacity="1.0">算术强度  AI = FLOPs / Byte  →</text><text x="72" y="335.0" font-size="13" fill="#5B6472" text-anchor="middle" transform="rotate(-90 72 335.0)">可达性能 →</text><path d="M104,496 L416,208 L632,208" fill="none" stroke="#3D5AFE" stroke-width="3"/><line x1="416" y1="208" x2="632" y2="208" stroke="#93A5FF" stroke-width="2" stroke-dasharray="5 5"/><text x="206" y="188" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">算力屋顶（Compute roof）</text><text x="216" y="270" font-size="12" font-weight="700" fill="#0E9F6E" text-anchor="start" opacity="1.0">带宽屋顶</text><text x="216" y="288" font-size="11" font-weight="400" fill="#0E9F6E" text-anchor="start" opacity="1.0">AI × BW</text><circle cx="526" cy="208" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/><text x="526" y="180" font-size="15" font-weight="800" fill="#7C3AED" text-anchor="middle" opacity="1.0">Prefill</text><text x="526" y="198" font-size="10" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">大 batch · 算力 bound</text><circle cx="261" cy="442" r="8" fill="#D97706" stroke="#FFFFFF" stroke-width="3"/><text x="277" y="434" font-size="15" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">Decode</text><text x="277" y="456" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">小 batch · 带宽 bound</text><rect x="468" y="246" width="136" height="38" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/><text x="536" y="270" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="middle" opacity="1.0">小 EP 更优</text><rect x="178" y="468" width="150" height="42" rx="8" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1"/><text x="253" y="494" font-size="12" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">大 EP 更优</text><text x="684" y="160" font-size="16" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">Prefill：权重读一次，服务很多 token</text><rect x="684" y="176" width="460" height="150" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><circle cx="712" cy="208" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="730" cy="208" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="748" cy="208" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="766" cy="208" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="784" cy="208" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="802" cy="208" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="712" cy="226" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="730" cy="226" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="748" cy="226" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="766" cy="226" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="784" cy="226" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="802" cy="226" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="712" cy="244" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="730" cy="244" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="748" cy="244" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="766" cy="244" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="784" cy="244" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="802" cy="244" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="712" cy="262" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="730" cy="262" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="748" cy="262" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="766" cy="262" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="784" cy="262" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><circle cx="802" cy="262" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><text x="832" y="216" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">一批很多 token</text><line x1="832" y1="248" x2="880" y2="248" stroke="#3D5AFE" stroke-width="2" marker-end="url(#ar-blue)"/><rect x="890" y="218" width="44" height="44" rx="6" fill="#FFFFFF" stroke="#3D5AFE" stroke-width="1.2"/><text x="912" y="245" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="middle" opacity="1.0">E</text><rect x="942" y="218" width="44" height="44" rx="6" fill="#FFFFFF" stroke="#3D5AFE" stroke-width="1.2"/><text x="964" y="245" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="middle" opacity="1.0">E</text><rect x="994" y="218" width="44" height="44" rx="6" fill="#FFFFFF" stroke="#3D5AFE" stroke-width="1.2"/><text x="1016" y="245" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="middle" opacity="1.0">E</text><text x="890" y="300" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">每次权重加载被大量 token 摊薄 → 通信成为主要矛盾</text><text x="684" y="372" font-size="16" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">Decode：每步只来几个 token，却要读一遍本地专家</text><rect x="684" y="388" width="460" height="150" rx="12" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.2"/><circle cx="712" cy="420" r="4" fill="#D97706" stroke="none" stroke-width="0"/><circle cx="730" cy="420" r="4" fill="#D97706" stroke="none" stroke-width="0"/><circle cx="712" cy="438" r="4" fill="#D97706" stroke="none" stroke-width="0"/><circle cx="730" cy="438" r="4" fill="#D97706" stroke="none" stroke-width="0"/><text x="750" y="428" font-size="11" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">每步少量新 token</text><line x1="832" y1="460" x2="880" y2="460" stroke="#D97706" stroke-width="2" marker-end="url(#ar-amber)"/><rect x="890" y="438" width="28" height="44" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/><text x="904" y="465" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">E</text><rect x="924" y="438" width="28" height="44" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/><text x="938" y="465" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">E</text><rect x="958" y="438" width="28" height="44" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/><text x="972" y="465" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">E</text><rect x="992" y="438" width="28" height="44" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/><text x="1006" y="465" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">E</text><rect x="1026" y="438" width="28" height="44" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/><text x="1040" y="465" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">E</text><rect x="1060" y="438" width="28" height="44" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/><text x="1074" y="465" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">E</text><rect x="1094" y="438" width="28" height="44" rx="5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.1"/><text x="1108" y="465" font-size="9" font-weight="800" fill="#D97706" text-anchor="middle" opacity="1.0">E</text><text x="890" y="510" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">本地专家越多，每步 HBM 读得越多 → Wide-EP 摊薄</text><rect x="86" y="556" width="1028" height="48" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="106" y="586" font-size="15" text-anchor="start"><tspan fill="#3D5AFE" font-weight="800">一句话：</tspan><tspan fill="#14171F" font-weight="500">Prefill 的瓶颈是「算」，Decode 的瓶颈是「搬」；EP 大小的选择，本质是在选你要优化哪一边。</tspan></text></svg>