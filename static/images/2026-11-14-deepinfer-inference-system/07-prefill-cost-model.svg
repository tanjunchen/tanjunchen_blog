<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="680" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">Prefill 单卡内：给定时间预算，反解这一步能算多少 token</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">chunk size 不固定；每步定一个纳秒级预算，用二次代价模型 cost(q,c) 反解 q，再用 DP 组内 allreduce-MIN 取最小预算</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><rect x="56" y="136" width="230" height="52" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/><text x="76" y="158" font-size="11" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">第 N 步</text><text x="76" y="178" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">时间预算 T = 8 ms</text><line x1="171" y1="188" x2="171" y2="214" stroke="#3D5AFE" stroke-width="2" marker-end="url(#ar-blue)"/><rect x="56" y="214" width="230" height="26" rx="6" fill="#EEF1F6" stroke="#D5DCE8" stroke-width="1"/><rect x="56" y="214" width="230" height="26" rx="6" fill="#3D5AFE" stroke="#3D5AFE" stroke-width="0"/><text x="171" y="232" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1.0">本步预算</text><line x1="171" y1="240" x2="171" y2="266" stroke="#3D5AFE" stroke-width="2" marker-end="url(#ar-blue)"/><rect x="56" y="266" width="230" height="76" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="76" y="292" font-size="11" font-weight="700" fill="#5B6472" text-anchor="start" opacity="1.0">反解 q*</text><text x="76" y="320" font-size="20" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">≈ 10,000 token</text><text x="56" y="372" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">q 上限 32,768</text><text x="56" y="394" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">预算再被 DP 组内</text><text x="56" y="412" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">allreduce-MIN 压低</text><rect x="340" y="150" width="400" height="340" rx="8" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1"/><line x1="340" y1="218.0" x2="740" y2="218.0" stroke="#EEF1F6" stroke-width="1"/><line x1="420.0" y1="150" x2="420.0" y2="490" stroke="#EEF1F6" stroke-width="1"/><line x1="340" y1="286.0" x2="740" y2="286.0" stroke="#EEF1F6" stroke-width="1"/><line x1="500.0" y1="150" x2="500.0" y2="490" stroke="#EEF1F6" stroke-width="1"/><line x1="340" y1="354.0" x2="740" y2="354.0" stroke="#EEF1F6" stroke-width="1"/><line x1="580.0" y1="150" x2="580.0" y2="490" stroke="#EEF1F6" stroke-width="1"/><line x1="340" y1="422.0" x2="740" y2="422.0" stroke="#EEF1F6" stroke-width="1"/><line x1="660.0" y1="150" x2="660.0" y2="490" stroke="#EEF1F6" stroke-width="1"/><text x="540.0" y="518" font-size="12" font-weight="600" fill="#5B6472" text-anchor="middle" opacity="1.0">q（本步 token 数）→</text><text x="326" y="320.0" font-size="12" fill="#5B6472" text-anchor="middle" transform="rotate(-90 326 320.0)">cost（ms）→</text><text x="340.0" y="508" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">0</text><text x="440.0" y="508" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">4K</text><text x="540.0" y="508" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">8K</text><text x="640.0" y="508" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">12K</text><text x="740.0" y="508" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="middle" opacity="1.0">16K</text><text x="332" y="494.0" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="end" opacity="1.0">0</text><text x="332" y="409.0" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="end" opacity="1.0">4</text><text x="332" y="324.0" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="end" opacity="1.0">8</text><text x="332" y="239.0" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="end" opacity="1.0">12</text><text x="332" y="154.0" font-size="9" font-weight="400" fill="#8A94A6" text-anchor="end" opacity="1.0">16</text><polyline points="340.0,490.0 350.0,484.8 360.0,479.5 370.0,474.1 380.0,468.5 390.0,462.8 400.0,457.0 410.0,451.0 420.0,444.8 430.0,438.6 440.0,432.2 450.0,425.7 460.0,419.0 470.0,412.2 480.0,405.3 490.0,398.2 500.0,391.0 510.0,383.6 520.0,376.2 530.0,368.6 540.0,360.8 550.0,352.9 560.0,344.9 570.0,336.7 580.0,328.4 590.0,320.0 600.0,311.4 610.0,302.7 620.0,293.9 630.0,284.9 640.0,275.8 650.0,266.6 660.0,257.2 670.0,247.6 680.0,238.0 690.0,228.2 700.0,218.3 710.0,208.2 720.0,198.0 730.0,187.7 740.0,177.2" fill="none" stroke="#3D5AFE" stroke-width="2.8" stroke-linejoin="round"/><polyline points="340.0,490.0 350.0,479.7 360.0,469.3 370.0,458.8 380.0,448.1 390.0,437.3 400.0,426.4 410.0,415.3 420.0,404.0 430.0,392.7 440.0,381.2 450.0,369.6 460.0,357.8 470.0,345.9 480.0,333.9 490.0,321.7 500.0,309.4 510.0,296.9 520.0,284.4 530.0,271.7 540.0,258.8 550.0,245.8 560.0,232.7 570.0,219.4 580.0,206.0 590.0,192.5 600.0,178.8 610.0,165.0" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="6 4"/><line x1="340" y1="320.0" x2="740" y2="320.0" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="4 4"/><text x="736" y="312.0" font-size="11" font-weight="800" fill="#DC2626" text-anchor="end" opacity="1.0">T = 8 ms</text><circle cx="590.0" cy="320.0" r="5" fill="#3D5AFE" stroke="#FFFFFF" stroke-width="2"/><line x1="590.0" y1="320.0" x2="590.0" y2="490" stroke="#3D5AFE" stroke-width="1" stroke-dasharray="3 3"/><text x="598.0" y="310.0" font-size="11" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">q* ≈ 10.0K</text><circle cx="491.25" cy="320.0" r="5" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/><line x1="491.25" y1="320.0" x2="491.25" y2="490" stroke="#D97706" stroke-width="1" stroke-dasharray="3 3"/><text x="483.25" y="340.0" font-size="11" font-weight="800" fill="#D97706" text-anchor="end" opacity="1.0">q* ≈ 6.1K</text><line x1="354" y1="168" x2="384" y2="168" stroke="#3D5AFE" stroke-width="2.5"/><text x="390" y="172" font-size="10" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">c = 32K</text><line x1="464" y1="168" x2="494" y2="168" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4"/><text x="500" y="172" font-size="10" font-weight="700" fill="#D97706" text-anchor="start" opacity="1.0">c = 128K</text><rect x="790" y="150" width="354" height="340" rx="12" fill="#F7F9FC" stroke="#DCE3EC" stroke-width="1.2"/><text x="810" y="182" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">把 q 反解出来</text><text x="810" y="214" font-size="14" font-weight="700" fill="#14171F" text-anchor="start" opacity="1.0">cost(q, c) = a·q² + b_eff·q + d</text><text x="810" y="242" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">b_eff = b0 + b1·c</text><text x="810" y="276" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">令 cost(q, c) = T：</text><text x="810" y="304" font-size="14" font-weight="700" fill="#14171F" text-anchor="start" opacity="1.0">a·q² + b_eff·q + (d − T) = 0</text><text x="810" y="340" font-size="12" font-weight="700" fill="#3D5AFE" text-anchor="start" opacity="1.0">q* = (−b_eff + √(b_eff² + 4a(T−d))) / 2a</text><line x1="810" y1="360" x2="1124" y2="360" stroke="#DCE3EC" stroke-width="1"/><text x="810" y="388" font-size="12" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">示例（示意参数）</text><text x="810" y="414" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">a = 2e−8 ms/token²</text><text x="810" y="436" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">b_eff = 6e−4 ms/token（c=32K）</text><text x="810" y="458" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">T = 8 ms，d ≈ 0</text><text x="810" y="484" font-size="13" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">→ q* ≈ 10,000 token</text><rect x="56" y="536" width="1088" height="118" rx="12" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="78" y="568" font-size="14" font-weight="800" fill="#DC2626" text-anchor="start" opacity="1.0">固定 chunk</text><text x="78" y="594" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">前缀一长，每步耗时漂移，TBT 跟着抖。</text><text x="434" y="568" font-size="14" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">按预算反解</text><text x="434" y="594" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">每步贴住预算，TBT 稳，SLA 好守。</text><text x="790" y="568" font-size="14" font-weight="800" fill="#0E9F6E" text-anchor="start" opacity="1.0">allreduce-MIN</text><text x="790" y="594" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">取组内最慢 rank 的剩余预算，避免木桶效应。</text><text x="78" y="632" font-size="13" font-weight="700" fill="#14171F" text-anchor="start" opacity="1.0">一句话：把 chunked prefill 从「按空间切」升级为「按时间切」—— 预算以纳秒计，反解出的 q 才是这一步真正该算的量。</text></svg>