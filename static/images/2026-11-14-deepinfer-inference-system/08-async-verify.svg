<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="770" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">把 GPU 的空闲时间填满：异步调度 + 变长投机验证</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">Decode 每步都要等 sample 结果才能排下一步；把 CPU 调度挪到 GPU 计算期间，再把验证长度交给 GPU 现算</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><text x="56" y="132" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">同步版：sample 之后要等 CPU 拿到结果，GPU 空转</text><text x="56" y="168" font-size="11" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">GPU</text><rect x="80.0" y="150" width="346.6666666666667" height="34" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="253.33333333333334" y="172" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">forward(N)</text><rect x="426.6666666666667" y="150" width="86.66666666666669" height="34" rx="6" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/><text x="470.0" y="172" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle" opacity="1.0">sample</text><rect x="513.3333333333334" y="150" width="173.33333333333334" height="34" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/><text x="600.0" y="172" font-size="10" font-weight="800" fill="#DC2626" text-anchor="middle" opacity="1.0">GPU 空闲</text><rect x="686.6666666666667" y="150" width="346.6666666666667" height="34" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="860.0" y="172" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">forward(N+1)</text><text x="56" y="218" font-size="11" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">CPU</text><rect x="80.0" y="200" width="86.66666666666669" height="26" rx="5" fill="#FFF7E6" stroke="#D97706" stroke-width="1"/><text x="123.33333333333334" y="218" font-size="9" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">schedule(N)</text><rect x="513.3333333333334" y="200" width="173.33333333333334" height="26" rx="5" fill="#FFF7E6" stroke="#D97706" stroke-width="1"/><text x="600.0" y="218" font-size="9" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">post(N-1)</text><rect x="686.6666666666667" y="200" width="86.66666666666669" height="26" rx="5" fill="#FFF7E6" stroke="#D97706" stroke-width="1"/><text x="730.0" y="218" font-size="8" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">schedule(N+1)</text><text x="600.0" y="246" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle" opacity="1.0">↑ 这 2 ms，GPU 在等 CPU</text><text x="56" y="292" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">异步版：GPU 算 N 的时候，CPU 已经在排 N+1</text><text x="56" y="328" font-size="11" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">GPU</text><rect x="80.0" y="310" width="346.6666666666667" height="34" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="253.33333333333334" y="332" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">forward(N)</text><rect x="426.6666666666667" y="310" width="86.66666666666669" height="34" rx="6" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.2"/><text x="470.0" y="332" font-size="9" font-weight="700" fill="#7C3AED" text-anchor="middle" opacity="1.0">sample(N)</text><rect x="513.3333333333334" y="310" width="346.6666666666667" height="34" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="686.6666666666667" y="332" font-size="11" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">forward(N+1)</text><text x="56" y="378" font-size="11" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">CPU</text><rect x="513.3333333333334" y="360" width="173.33333333333334" height="26" rx="5" fill="#FFF7E6" stroke="#D97706" stroke-width="1"/><text x="600.0" y="378" font-size="9" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">schedule(N+1)</text><rect x="513.3333333333334" y="392" width="173.33333333333334" height="26" rx="5" fill="#FFF7E6" stroke="#D97706" stroke-width="1"/><text x="600.0" y="410" font-size="9" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">post(N-1)</text><rect x="686.6666666666667" y="360" width="86.66666666666669" height="26" rx="5" fill="#FFF7E6" stroke="#D97706" stroke-width="1"/><text x="730.0" y="378" font-size="8" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">launch sample</text><line x1="513.3333333333334" y1="436" x2="686.6666666666667" y2="436" stroke="#0E9F6E" stroke-width="2" stroke-dasharray="3 3"/><text x="600.0" y="454" font-size="10" font-weight="800" fill="#0E9F6E" text-anchor="middle" opacity="1.0">GPU / CPU 重叠，无空闲</text><text x="56" y="500" font-size="14" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">变长验证：把验证算力花在边际收益最高的 token 上</text><text x="56" y="524" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">5 个 draft token 的接受概率不同；固定验证 5 个，会在低概率位上浪费算力。</text><rect x="80" y="565.0" width="70" height="95.0" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="115.0" y="557.0" font-size="10" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">0.95</text><text x="115.0" y="678" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">draft 1</text><rect x="176" y="570.0" width="70" height="90.0" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="211.0" y="562.0" font-size="10" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">0.90</text><text x="211.0" y="678" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">draft 2</text><rect x="272" y="580.0" width="70" height="80.0" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="307.0" y="572.0" font-size="10" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">0.80</text><text x="307.0" y="678" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">draft 3</text><rect x="368" y="600.0" width="70" height="60.0" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="403.0" y="592.0" font-size="10" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">0.60</text><text x="403.0" y="678" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">draft 4</text><rect x="464" y="620.0" width="70" height="40.0" rx="6" fill="#EEF2FF" stroke="#3D5AFE" stroke-width="1.2"/><text x="499.0" y="612.0" font-size="10" font-weight="700" fill="#3D5AFE" text-anchor="middle" opacity="1.0">0.40</text><text x="499.0" y="678" font-size="9" font-weight="400" fill="#5B6472" text-anchor="middle" opacity="1.0">draft 5</text><line x1="454" y1="554" x2="454" y2="664" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4"/><text x="448" y="546" font-size="10" font-weight="800" fill="#DC2626" text-anchor="end" opacity="1.0">动态截断</text><rect x="600" y="550" width="504" height="76" rx="10" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.2"/><text x="620" y="578" font-size="12" font-weight="700" fill="#14171F" text-anchor="start" opacity="1.0">验证 token 5.00 → 3.2–4.4</text><text x="620" y="600" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">接受长度 3.29 vs 3.20（基本不变）</text><text x="620" y="618" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">生产运行点折合 +4~7% 吞吐（官方线上约 +6%）</text><rect x="600" y="640" width="504" height="64" rx="10" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1.2"/><text x="620" y="666" font-size="11" font-weight="800" fill="#7C3AED" text-anchor="start" opacity="1.0">异步下 confidence 还没回传？</text><text x="620" y="688" font-size="10" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">CPU 只定总预算；逐请求长度由 GPU kernel 现算（累乘/排序/remap），写回 pinned buffer。</text><text x="56" y="740" font-size="12" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">一句话：异步调度解决「CPU 等 GPU」，变长验证解决「GPU 等低概率 token」——两者都在填同一段空闲。</text></svg>