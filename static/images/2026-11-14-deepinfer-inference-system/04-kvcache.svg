<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3D5AFE"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#14171F"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0E9F6E"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/></marker><marker id="ar-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8A94A6"/></marker></defs><rect width="1200" height="720" fill="#FFFFFF"/><text x="56" y="50" font-size="30" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">KVCache 的三层账本：HBM、本机内存、独立 3FS</text><text x="56" y="82" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">热数据在显存，会话窗口在内存，跨请求复用的前缀在 3FS；三层各自解决不同的复用距离</text><line x1="56" y1="100" x2="1144" y2="100" stroke="#DCE3EC" stroke-width="1.5"/><rect x="56" y="126" width="760" height="150" rx="14" fill="#F3EEFF" stroke="#DDD6FE" stroke-width="1.4"/><rect x="76" y="146" width="150" height="30" rx="15.0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/><text x="151.0" y="165.68" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle" opacity="1.0">GPU HBM</text><text x="76" y="204" font-size="16" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">运行中的 Block KV + State KV（含 SWA）</text><text x="76" y="230" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">容量：单卡显存 · 生命周期：随实例 · 访问：TB/s 级</text><text x="76" y="254" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">命中即用，换入/落盘由下面的两层兜底</text><rect x="56" y="300" width="760" height="150" rx="14" fill="#FFF7E6" stroke="#F5D0A9" stroke-width="1.4"/><rect x="76" y="320" width="190" height="30" rx="15.0" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><text x="171.0" y="339.32" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle" opacity="1.0">本机内存（P/D 机器）</text><text x="76" y="378" font-size="16" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">SWA KV：每个序列一个定长 slot（StateBlock）</text><text x="76" y="404" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">20 层 × 134 token × 528 B = 1,415,040 B ≈ 1.4 MB / seq</text><text x="76" y="428" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">单副本，3FS 上没有；TTL ≈ 180 s，命中率 &gt; 98%</text><rect x="56" y="474" width="760" height="150" rx="14" fill="#E8F7F1" stroke="#A7E3CB" stroke-width="1.4"/><rect x="76" y="494" width="170" height="30" rx="15.0" fill="#FFFFFF" stroke="#0E9F6E" stroke-width="1.2"/><text x="161.0" y="513.68" font-size="13" font-weight="700" fill="#0E9F6E" text-anchor="middle" opacity="1.0">独立 3FS 集群</text><text x="76" y="552" font-size="16" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">Block KV：128-token 分页，4 层 main KV + indexer K</text><text x="76" y="578" font-size="13" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">100 PiB · 10 TiB/s 读 · 850 GiB/s 写 · 10+2 EC</text><text x="76" y="602" font-size="12" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">TTL：agent 3 天 / chatbot 7 天；GC 按 LRU 淘汰</text><line x1="410" y1="276" x2="410" y2="300" stroke="#7C3AED" stroke-width="2" marker-end="url(#ar-purple)"/><line x1="410" y1="450" x2="410" y2="474" stroke="#D97706" stroke-width="2" marker-end="url(#ar-amber)"/><text x="422" y="292" font-size="10" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">换入 / 落盘</text><text x="422" y="466" font-size="10" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">GDR / RDMA</text><rect x="840" y="126" width="304" height="498" rx="14" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.4"/><text x="860" y="158" font-size="15" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">为什么不用本机多级缓存？</text><circle cx="868" cy="196" r="4" fill="#3D5AFE" stroke="none" stroke-width="0"/><text x="882" y="200" font-size="13" font-weight="800" fill="#3D5AFE" text-anchor="start" opacity="1.0">任意 P 命中任意前缀</text><text x="882" y="222" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">缓存不绑定在产生它的那台机器上，路由自由。</text><circle cx="868" cy="284" r="4" fill="#7C3AED" stroke="none" stroke-width="0"/><text x="882" y="288" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="start" opacity="1.0">避免前缀亲和冲突</text><text x="882" y="310" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">不用为了缓存命中把请求钉死在某台 P，</text><text x="882" y="328" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">负载均衡更好做。</text><circle cx="868" cy="372" r="4" fill="#0E9F6E" stroke="none" stroke-width="0"/><text x="882" y="376" font-size="13" font-weight="800" fill="#0E9F6E" text-anchor="start" opacity="1.0">计算 / 存储解耦</text><text x="882" y="398" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">存储集群独立扩缩容，不被计算节点的规格绑住。</text><circle cx="868" cy="460" r="4" fill="#D97706" stroke="none" stroke-width="0"/><text x="882" y="464" font-size="13" font-weight="800" fill="#D97706" text-anchor="start" opacity="1.0">故障域隔离</text><text x="882" y="486" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">计算节点故障率比存储高一个数量级以上，</text><text x="882" y="504" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start" opacity="1.0">缓存放 3FS 更稳。</text><line x1="860" y1="566" x2="1124" y2="566" stroke="#DCE3EC" stroke-width="1"/><text x="860" y="592" font-size="12" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">结论：用一点网络带宽，换路由自由度</text><text x="860" y="612" font-size="12" font-weight="800" fill="#14171F" text-anchor="start" opacity="1.0">与计算/存储的独立扩缩容。</text><rect x="56" y="646" width="1088" height="46" rx="10" fill="#F7F9FC" stroke="#E6EBF3" stroke-width="1"/><text x="76" y="675" font-size="13" text-anchor="start"><tspan fill="#DC2626" font-weight="800">口径提醒：</tspan><tspan fill="#14171F" font-weight="500">SWA 的 528 B/token 是单层口径；20 层合计约 10.5 KB/token，但只保留 134 token 的窗口，所以每序列只有 1.4 MB。</tspan></text></svg>