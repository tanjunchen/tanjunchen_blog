<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">一张图看懂 KV Cache 显存公式</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#888">记住这 6 个因子 —— 后文几乎所有优化，都是在对它们「逐个下手」</text>

  <!-- formula -->
  <rect x="60" y="74" width="780" height="58" rx="10" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="450" y="104" text-anchor="middle" font-size="16" font-weight="700" fill="#333">显存 ≈ <tspan fill="#C7000B">2</tspan> × <tspan fill="#2e86de">batch</tspan> × <tspan fill="#8e44ad">seq_len</tspan> × <tspan fill="#5a8c00">num_layers</tspan> × <tspan fill="#d35400">num_kv_heads</tspan> × <tspan fill="#16a085">head_dim</tspan> × <tspan fill="#7a0007">dtype_bytes</tspan></text>
  <text x="450" y="124" text-anchor="middle" font-size="10.5" fill="#888">系数 2 = Key + Value；KV Cache 随 batch × 序列长度「线性增长」</text>

  <!-- factor cards -> optimization -->
  <g font-size="11">
    <rect x="40" y="156" width="265" height="80" rx="8" fill="#f6eefb" stroke="#8e44ad"/>
    <text x="56" y="180" font-size="13" font-weight="700" fill="#8e44ad">↓ seq_len（序列长度）</text>
    <text x="56" y="201" fill="#555">稀疏化：SWA / StreamingLLM / H2O / NSA</text>
    <text x="56" y="221" fill="#555">前缀复用：Prompt Cache / Radix / Chunk</text>

    <rect x="318" y="156" width="265" height="80" rx="8" fill="#fdf3e9" stroke="#d35400"/>
    <text x="334" y="180" font-size="13" font-weight="700" fill="#d35400">↓ num_kv_heads（KV 头数）</text>
    <text x="334" y="201" fill="#555">MQA：多 Query 头共享一组 K/V</text>
    <text x="334" y="221" fill="#555">GQA：分组共享（已成主流）</text>

    <rect x="596" y="156" width="265" height="80" rx="8" fill="#fdeeee" stroke="#7a0007"/>
    <text x="612" y="180" font-size="13" font-weight="700" fill="#7a0007">↓ dtype_bytes（每值比特）</text>
    <text x="612" y="201" fill="#555">量化：FP16 → FP8 / INT8 / INT4</text>
    <text x="612" y="221" fill="#555">slot 数不变，直接砍显存</text>

    <rect x="40" y="248" width="265" height="80" rx="8" fill="#e9f5f1" stroke="#16a085"/>
    <text x="56" y="272" font-size="13" font-weight="700" fill="#16a085">↓ head_dim（头维度）</text>
    <text x="56" y="293" fill="#555">MLA：DeepSeek 低秩压缩</text>
    <text x="56" y="313" fill="#555">Double Sparsity：Token + Channel</text>

    <rect x="318" y="248" width="265" height="80" rx="8" fill="#f2f9e8" stroke="#5a8c00"/>
    <text x="334" y="272" font-size="13" font-weight="700" fill="#5a8c00">↓ num_layers（缓存的层）</text>
    <text x="334" y="293" fill="#555">跨层共享：YOCO / CLA / MLKV</text>
    <text x="334" y="313" fill="#555">LayerSkip：早退 + 自投机</text>

    <rect x="596" y="248" width="265" height="80" rx="8" fill="#eef4ff" stroke="#2e86de"/>
    <text x="612" y="272" font-size="13" font-weight="700" fill="#2e86de">↑ 显存利用率</text>
    <text x="612" y="293" fill="#555">PagedAttention：分页管理</text>
    <text x="612" y="313" fill="#555">消除碎片，让显存「装得满」</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="344" width="820" height="66" rx="10" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="60" y="370" font-size="13" font-weight="700" fill="#333">两阶段视角：</text>
  <text x="60" y="392" font-size="11.5" fill="#555">· Prefill（预填充）：一次性算完 Prompt，<tspan fill="#2e86de" font-weight="700">计算密集</tspan>，关注 TTFT（首字延迟）</text>
  <text x="470" y="392" font-size="11.5" fill="#555">· Decode（解码）：逐 token 生成，每步读全部历史 KV，<tspan fill="#5a8c00" font-weight="700">访存密集</tspan></text>
</svg>
