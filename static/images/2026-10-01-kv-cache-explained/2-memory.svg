<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">两阶段推理与显存占用：KV Cache 是「隐形吃显存大户」</text>

  <!-- Prefill vs Decode -->
  <rect x="30" y="60" width="400" height="150" rx="10" fill="#eef4ff" stroke="#2e86de" stroke-width="2"/>
  <text x="230" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5a9c">Prefill 预填充阶段</text>
  <text x="230" y="112" text-anchor="middle" font-size="12" fill="#555">一次性处理整个 Prompt，并行度高</text>
  <text x="230" y="134" text-anchor="middle" font-size="12" fill="#555">计算密集（compute-bound）</text>
  <text x="230" y="156" text-anchor="middle" font-size="12" fill="#555">产出：第 1 个 token + 全量 KV Cache</text>
  <text x="230" y="184" text-anchor="middle" font-size="13" fill="#1a5a9c" font-weight="700">关键指标：TTFT（首字延迟）</text>

  <rect x="470" y="60" width="400" height="150" rx="10" fill="#f2f9e8" stroke="#5a8c00" stroke-width="2"/>
  <text x="670" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#3a5c00">Decode 解码阶段</text>
  <text x="670" y="112" text-anchor="middle" font-size="12" fill="#555">自回归逐个吐 token，单步计算量小</text>
  <text x="670" y="134" text-anchor="middle" font-size="12" fill="#555">访存密集（memory-bound）</text>
  <text x="670" y="156" text-anchor="middle" font-size="12" fill="#555">每步都要读取全部历史 KV Cache</text>
  <text x="670" y="184" text-anchor="middle" font-size="13" fill="#3a5c00" font-weight="700">关键指标：TPOT / TBT（吐字间隔）</text>

  <!-- memory bar -->
  <text x="30" y="248" font-size="15" font-weight="700" fill="#333">峰值显存 = 模型权重 + KV Cache（随 batch × 序列长度线性增长）</text>
  <rect x="30" y="262" width="300" height="40" fill="#8e9aa6"/>
  <text x="180" y="287" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">模型权重（固定）</text>
  <rect x="330" y="262" width="500" height="40" fill="#e6a817"/>
  <text x="580" y="287" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">KV Cache（越聊越大 ↗）</text>

  <!-- formula -->
  <rect x="30" y="326" width="840" height="76" rx="10" fill="#fff7e6" stroke="#e6a817"/>
  <text x="50" y="352" font-size="13" font-weight="700" fill="#8a6200">KV Cache 显存估算公式：</text>
  <text x="50" y="378" font-size="13" fill="#333">显存 ≈ 2 × batch × seq_len × num_layers × num_kv_heads × head_dim × dtype_bytes</text>
  <text x="50" y="396" font-size="11" fill="#8a6200">（系数 2 = Key + Value；正是这 6 个因子，构成了后文所有优化的「下手点」）</text>

  <!-- numeric example -->
  <text x="30" y="438" font-size="14" font-weight="700" fill="#333">算一笔账（类 Qwen-7B：32 层 · 32 KV 头 · head_dim 128 · FP16，batch=1）</text>
  <text x="30" y="458" font-size="11.5" fill="#666">单 token 的 KV ≈ 2 × 32 × 32 × 128 × 2 B ≈ 512 KB —— 上下文越长，KV Cache 增长越凶：</text>

  <rect x="30" y="470" width="120" height="34" rx="5" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="90" y="492" text-anchor="middle" font-size="12" fill="#3a5c00" font-weight="700">4K ≈ 2 GB</text>
  <rect x="170" y="470" width="520" height="34" rx="5" fill="#fdeeee" stroke="#C7000B"/>
  <text x="430" y="492" text-anchor="middle" font-size="12" fill="#7a0007" font-weight="700">100K ≈ 50 GB（往往已超过模型权重本身）</text>
  <text x="710" y="492" font-size="12" fill="#C7000B" font-weight="700">↗ 25×</text>
</svg>
