<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">vLLM · PagedAttention：像操作系统虚拟内存一样管 KV</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#888">逻辑连续、物理不连续 —— 用 Block Table 做映射，消除显存碎片</text>

  <!-- logical sequence -->
  <text x="150" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1a5a9c">逻辑 KV（一个序列）</text>
  <g font-size="10" fill="#333">
    <rect x="40" y="98" width="48" height="30" rx="4" fill="#eef4ff" stroke="#2e86de"/><text x="64" y="118" text-anchor="middle">blk0</text>
    <rect x="92" y="98" width="48" height="30" rx="4" fill="#eef4ff" stroke="#2e86de"/><text x="116" y="118" text-anchor="middle">blk1</text>
    <rect x="144" y="98" width="48" height="30" rx="4" fill="#eef4ff" stroke="#2e86de"/><text x="168" y="118" text-anchor="middle">blk2</text>
    <rect x="196" y="98" width="48" height="30" rx="4" fill="#eef4ff" stroke="#2e86de"/><text x="220" y="118" text-anchor="middle">blk3</text>
  </g>
  <text x="150" y="146" text-anchor="middle" font-size="10" fill="#888">每个 Block 存固定数量 token 的 K/V</text>

  <!-- block table -->
  <rect x="330" y="92" width="200" height="150" rx="8" fill="#fff8e7" stroke="#e0a800"/>
  <text x="430" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6200">Block Table（页表）</text>
  <g font-size="11" fill="#555">
    <text x="350" y="140">逻辑 blk0  →  物理 #7</text>
    <text x="350" y="166">逻辑 blk1  →  物理 #2</text>
    <text x="350" y="192">逻辑 blk2  →  物理 #9</text>
    <text x="350" y="218">逻辑 blk3  →  物理 #4</text>
  </g>
  <path d="M248 113 L328 150" stroke="#e0a800" stroke-width="1.8" marker-end="url(#pa)"/>

  <!-- physical blocks -->
  <text x="730" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#5a8c00">物理显存池（GPU HBM）</text>
  <g font-size="10" fill="#333">
    <rect x="600" y="98" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb"/><text x="622" y="118" text-anchor="middle">#1</text>
    <rect x="648" y="98" width="44" height="30" rx="4" fill="#f2f9e8" stroke="#5a8c00"/><text x="670" y="118" text-anchor="middle">#2</text>
    <rect x="696" y="98" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb"/><text x="718" y="118" text-anchor="middle">#3</text>
    <rect x="744" y="98" width="44" height="30" rx="4" fill="#f2f9e8" stroke="#5a8c00"/><text x="766" y="118" text-anchor="middle">#4</text>
    <rect x="792" y="98" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb"/><text x="814" y="118" text-anchor="middle">#5</text>
    <rect x="600" y="134" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb"/><text x="622" y="154" text-anchor="middle">#6</text>
    <rect x="648" y="134" width="44" height="30" rx="4" fill="#f2f9e8" stroke="#5a8c00"/><text x="670" y="154" text-anchor="middle">#7</text>
    <rect x="696" y="134" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb"/><text x="718" y="154" text-anchor="middle">#8</text>
    <rect x="744" y="134" width="44" height="30" rx="4" fill="#f2f9e8" stroke="#5a8c00"/><text x="766" y="154" text-anchor="middle">#9</text>
    <rect x="792" y="134" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb"/><text x="814" y="154" text-anchor="middle">#10</text>
  </g>
  <text x="718" y="190" text-anchor="middle" font-size="10" fill="#5a8c00">绿色=已占用　灰色=空闲（FreeQueue / LRU 管理）</text>
  <path d="M532 160 L598 150" stroke="#5a8c00" stroke-width="1.8" marker-end="url(#pa2)"/>

  <!-- features -->
  <rect x="30" y="256" width="840" height="146" rx="10" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="50" y="282" font-size="13" font-weight="700" fill="#333">四个关键机制：</text>
  <text x="50" y="308" font-size="11.5" fill="#555">① <tspan font-weight="700">分页管理</tspan>：KV 切成固定大小物理 Block，逻辑连续物理不连续 → 消碎片、提利用率</text>
  <text x="50" y="332" font-size="11.5" fill="#555">② <tspan font-weight="700">初始化预分配</tspan>：启动时 dummy 前向度量激活显存，估算可分配多少 Block，一次性建好显存池</text>
  <text x="50" y="356" font-size="11.5" fill="#555">③ <tspan font-weight="700">Prefix Caching</tspan>：给 Block 算 hash，相同前缀直接命中复用，跨请求共享 system prompt</text>
  <text x="50" y="380" font-size="11.5" fill="#555">④ <tspan font-weight="700">KV Connector</tspan>：抽象 KV 跨节点传输，支撑 PD 分离（Prefill / Decode 分开部署）</text>

  <defs>
    <marker id="pa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#e0a800"/></marker>
    <marker id="pa2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5a8c00"/></marker>
  </defs>
</svg>
