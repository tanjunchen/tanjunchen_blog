<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">KV Cache 优化的两套视角</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#888">左：按「层次」分类（来自综述 A Survey on LLM Acceleration based on KV Cache Management）；右：按「显存公式」逐因子下手</text>

  <!-- Left: three levels -->
  <text x="235" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#333">① 按层次分类</text>

  <rect x="40" y="96" width="390" height="104" rx="10" fill="#eef4ff" stroke="#2e86de"/>
  <text x="60" y="120" font-size="14" font-weight="700" fill="#1a5a9c">Token 级（不改模型结构）</text>
  <text x="60" y="142" font-size="11" fill="#555">选择 · 预算分配 · 合并 · 量化 · 低秩分解</text>
  <text x="60" y="164" font-size="11" fill="#888">代表：H2O、SnapKV、KIVI（量化）</text>
  <text x="60" y="186" font-size="11" fill="#888">特点：细粒度、即插即用</text>

  <rect x="40" y="212" width="390" height="104" rx="10" fill="#f2f9e8" stroke="#5a8c00"/>
  <text x="60" y="236" font-size="14" font-weight="700" fill="#3a5c00">模型级（改架构）</text>
  <text x="60" y="258" font-size="11" fill="#555">注意力分组共享 · 新注意力机制 · 非 Transformer</text>
  <text x="60" y="280" font-size="11" fill="#888">代表：MQA / GQA / MLA、Mamba / RWKV</text>
  <text x="60" y="302" font-size="11" fill="#888">特点：治本，但通常需重训</text>

  <rect x="40" y="328" width="390" height="104" rx="10" fill="#fdeeee" stroke="#C7000B"/>
  <text x="60" y="352" font-size="14" font-weight="700" fill="#7a0007">系统级（改工程）</text>
  <text x="60" y="374" font-size="11" fill="#555">内存管理 · 调度策略 · 硬件感知</text>
  <text x="60" y="396" font-size="11" fill="#888">代表：PagedAttention、RadixAttention、Offload</text>
  <text x="60" y="418" font-size="11" fill="#888">特点：无损、工程收益最直接</text>

  <!-- divider -->
  <line x1="460" y1="70" x2="460" y2="450" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Right: formula-angle six directions -->
  <text x="680" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#333">② 按显存公式逐因子优化</text>

  <g font-size="12">
    <rect x="490" y="96" width="380" height="50" rx="8" fill="#f7f9fb" stroke="#dbe2ea"/>
    <text x="504" y="116" font-size="13" font-weight="700" fill="#333">↓ 序列长度 seq_len</text>
    <text x="504" y="136" font-size="11" fill="#666">稀疏化（SWA/StreamingLLM/H2O/NSA）+ 前缀复用</text>

    <rect x="490" y="154" width="380" height="42" rx="8" fill="#f7f9fb" stroke="#dbe2ea"/>
    <text x="504" y="174" font-size="13" font-weight="700" fill="#333">↓ KV 头数 num_kv_heads</text>
    <text x="504" y="190" font-size="11" fill="#666">MQA / GQA（多查询 / 分组查询注意力）</text>

    <rect x="490" y="204" width="380" height="42" rx="8" fill="#f7f9fb" stroke="#dbe2ea"/>
    <text x="504" y="224" font-size="13" font-weight="700" fill="#333">↓ 每值比特 dtype_bytes</text>
    <text x="504" y="240" font-size="11" fill="#666">量化 FP16 → FP8 / INT8 / INT4</text>

    <rect x="490" y="254" width="380" height="42" rx="8" fill="#f7f9fb" stroke="#dbe2ea"/>
    <text x="504" y="274" font-size="13" font-weight="700" fill="#333">↓ 头维度 head_dim</text>
    <text x="504" y="290" font-size="11" fill="#666">MLA（DeepSeek 低秩压缩）、Double Sparsity</text>

    <rect x="490" y="304" width="380" height="42" rx="8" fill="#f7f9fb" stroke="#dbe2ea"/>
    <text x="504" y="324" font-size="13" font-weight="700" fill="#333">↓ 层数 num_layers（缓存的层）</text>
    <text x="504" y="340" font-size="11" fill="#666">跨层共享 YOCO / CLA / MLKV、LayerSkip</text>

    <rect x="490" y="354" width="380" height="42" rx="8" fill="#f7f9fb" stroke="#dbe2ea"/>
    <text x="504" y="374" font-size="13" font-weight="700" fill="#333">↑ 显存利用率</text>
    <text x="504" y="390" font-size="11" fill="#666">PagedAttention 分页管理，消除碎片</text>

    <rect x="490" y="404" width="380" height="42" rx="8" fill="#eef7e0" stroke="#5a8c00"/>
    <text x="504" y="424" font-size="12" font-weight="700" fill="#3a5c00">另一维度：按阶段（Prefill / Decode）分别优化</text>
    <text x="504" y="440" font-size="10.5" fill="#5a8c00">Prefill 压 prompt 稀疏；Decode 稀疏读 + offload</text>
  </g>
</svg>
