<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">连续批处理（Continuous Batching）：让 GPU 不空转</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#888">以「迭代」为粒度调度 —— 谁生成完就移出，新请求立刻补位（源自 ORCA）</text>

  <!-- static batching -->
  <text x="30" y="86" font-size="14" font-weight="700" fill="#C7000B">❌ 静态批处理：等整批都生成完，才换下一批（大量空转）</text>
  <g font-size="10" fill="#fff" font-weight="700">
    <rect x="40" y="98" width="60" height="24" rx="4" fill="#5a8c00"/><text x="70" y="115" text-anchor="middle">R1</text>
    <rect x="100" y="98" width="200" height="24" rx="4" fill="#5a8c00"/><text x="200" y="115" text-anchor="middle">R1 生成中</text>
    <rect x="40" y="126" width="60" height="24" rx="4" fill="#2e86de"/><text x="70" y="143" text-anchor="middle">R2</text>
    <rect x="100" y="126" width="90" height="24" rx="4" fill="#2e86de"/><text x="145" y="143" text-anchor="middle">R2 生成</text>
    <rect x="190" y="126" width="110" height="24" rx="4" fill="#d9dde1"/><text x="245" y="143" text-anchor="middle" fill="#888">空转等待</text>
    <rect x="40" y="154" width="60" height="24" rx="4" fill="#8e44ad"/><text x="70" y="171" text-anchor="middle">R3</text>
    <rect x="100" y="154" width="50" height="24" rx="4" fill="#8e44ad"/><text x="125" y="171" text-anchor="middle">R3</text>
    <rect x="150" y="154" width="150" height="24" rx="4" fill="#d9dde1"/><text x="225" y="171" text-anchor="middle" fill="#888">空转等待</text>
  </g>
  <path d="M300 92 L300 186" stroke="#C7000B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="340" y="145" font-size="11" fill="#C7000B">整批对齐到最长的 R1，GPU 利用率低</text>

  <!-- continuous batching -->
  <text x="30" y="226" font-size="14" font-weight="700" fill="#5a8c00">✅ 连续批处理：每次迭代动态进出，空位立即被新请求填满</text>
  <g font-size="10" fill="#fff" font-weight="700">
    <rect x="40" y="238" width="60" height="24" rx="4" fill="#5a8c00"/><text x="70" y="255" text-anchor="middle">R1</text>
    <rect x="100" y="238" width="200" height="24" rx="4" fill="#5a8c00"/><text x="200" y="255" text-anchor="middle">R1 生成中</text>
    <rect x="40" y="266" width="60" height="24" rx="4" fill="#2e86de"/><text x="70" y="283" text-anchor="middle">R2</text>
    <rect x="100" y="266" width="90" height="24" rx="4" fill="#2e86de"/><text x="145" y="283" text-anchor="middle">R2</text>
    <rect x="190" y="266" width="110" height="24" rx="4" fill="#16a085"/><text x="245" y="283" text-anchor="middle">R4 补位</text>
    <rect x="40" y="294" width="60" height="24" rx="4" fill="#8e44ad"/><text x="70" y="311" text-anchor="middle">R3</text>
    <rect x="100" y="294" width="50" height="24" rx="4" fill="#8e44ad"/><text x="125" y="311" text-anchor="middle">R3</text>
    <rect x="150" y="294" width="150" height="24" rx="4" fill="#e67e22"/><text x="225" y="311" text-anchor="middle">R5 补位</text>
  </g>
  <text x="340" y="285" font-size="11" fill="#5a8c00">R2/R3 生成完即释放，R4/R5 立刻补上，吞吐大增</text>

  <!-- bottom: chunked prefill + cache-aware -->
  <rect x="30" y="330" width="840" height="60" rx="10" fill="#f7f9fb" stroke="#dbe2ea"/>
  <text x="50" y="354" font-size="11.5" fill="#555">· <tspan font-weight="700" fill="#333">Chunked Prefill（SARATHI）</tspan>：长 prompt 的 Prefill 切块，「搭车」到 Decode 批次，平滑算力尖峰，兼顾 TTFT / TPOT</text>
  <text x="50" y="376" font-size="11.5" fill="#555">· <tspan font-weight="700" fill="#333">缓存感知调度</tspan>：输入分块算 hash，优先调度到「前缀匹配最长」的实例，避免无谓的 Prefill 重算</text>
</svg>
